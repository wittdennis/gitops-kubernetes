---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: radicale-backup
spec:
  schedules:
    - "16 3 * * *"
  concurrencyPolicy: "Replace"
  startingDeadlineSeconds: 0
  successfulJobsHistoryLimit: 1
  workflowSpec:
    entrypoint: main
    onExit: exit-handler
    podMetadata:
      labels:
        network-policy/allow-default-tenant-s3-traffic: apply
        network-policy/allow-kube-apiserver-traffic: apply
        network-policy/allow-backup-egress: apply
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    serviceAccountName: radicale-workflows
    templates:
      - name: main
        dag:
          tasks:
            - name: scale-down
              arguments:
                parameters:
                  - name: name
                    value: homelab-radicale
                  - name: namespace
                    value: radicale
                  - name: replicaCount
                    value: "0"
                  - name: type
                    value: deployment
              templateRef:
                template: scale-workload
                name: scale-workload
                clusterScope: true

            - name: backup
              dependencies: [scale-down]
              templateRef:
                template: restic-backup
                name: restic-backup
                clusterScope: true
              arguments:
                parameters:
                  - name: host
                    value: radicale
                  - name: repository
                    value: s3:https://nbg1.your-objectstorage.com/pseud0random-backups/radicale
                  - name: secretName
                    value: radicale-backup-settings
                  - name: paths
                    value: /mnt/data
                  - name: retention
                    value: --keep-last 7
                  - name: podSpecPatch
                    value: |
                      volumes:
                        - name: data
                          persistentVolumeClaim:
                            claimName: homelab-radicale-data
                            readOnly: true
                      containers:
                        - name: main
                          volumeMounts:
                            - name: data
                              mountPath: /mnt/data
                              readOnly: true

      - name: exit-handler
        steps:
          - - name: scale-up
              arguments:
                parameters:
                  - name: name
                    value: homelab-radicale
                  - name: namespace
                    value: radicale
                  - name: replicaCount
                    value: "1"
                  - name: type
                    value: deployment
              templateRef:
                template: scale-workload
                name: scale-workload
                clusterScope: true
