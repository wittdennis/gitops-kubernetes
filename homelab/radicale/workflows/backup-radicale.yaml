---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: radicale-backup
spec:
  schedules:
    - "16 3 * * *"
  concurrencyPolicy: "Replace"
  startingDeadlineSeconds: 0
  successfulJobsHistoryLimit: 1
  workflowSpec:
    entrypoint: main
    onExit: exit-handler
    podMetadata:
      labels:
        network-policy/allow-default-tenant-s3-traffic: apply
        network-policy/allow-kube-apiserver-traffic: apply
        network-policy/allow-backup-egress: apply
    artifactGC:
      strategy: OnWorkflowDeletion
      serviceAccountName: radicale-workflows
      podMetadata:
        labels:
          network-policy/allow-default-tenant-s3-traffic: apply
          network-policy/allow-kube-apiserver-traffic: apply
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    serviceAccountName: radicale-workflows
    volumes:
      - name: tmp
        emptyDir: {}
      - name: radicale-data
        persistentVolumeClaim:
          claimName: homelab-radicale-data
          readOnly: true
    templates:
      - name: main
        dag:
          tasks:
            - name: scale-down
              arguments:
                parameters:
                  - name: name
                    value: homelab-radicale
                  - name: namespace
                    value: radicale
                  - name: replicaCount
                    value: "0"
                  - name: type
                    value: deployment
              templateRef:
                template: scale-workload
                name: scale-workload
                clusterScope: true

            - name: copy-data
              dependencies: [scale-down]
              template: copy-data

            - name: upload-backup
              dependencies: [copy-data]
              template: restic
              arguments:
                artifacts:
                  - name: data-backup-archive
                    from: "{{tasks.copy-data.outputs.artifacts.data-backup-archive}}"

      - name: copy-data
        outputs:
          artifacts:
            - name: data-backup-archive
              path: /tmp/radicale-data.tar.xz
              s3:
                key: "{{workflow.name}}/radicale-data.tar.xz"
        container:
          image: ghcr.io/wittdennis/devops-tools:1.2.38 # renovate
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: radicale-data
              mountPath: /mnt/radicale-data
          workingDir: /tmp
          command: [sh, -c]
          args:
            - |
              #!/bin/sh
              set -eu

              mkdir -p /tmp/data
              cp -R /mnt/radicale-data/. /tmp/data

              ARCHIVE="/tmp/radicale-data.tar.xz"
              echo "Creating archive $ARCHIVE ..."
              tar -cJf "$ARCHIVE" -C /tmp data
              du -sch $ARCHIVE
          securityContext:
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault

      - name: restic
        inputs:
          artifacts:
            - name: data-backup-archive
              path: /tmp/backup/data-backup.tar.xz
        container:
          image: restic/restic:0.19.1 # renovate
          command: [sh, -c]
          args:
            - |
              restic init --no-cache || true
              restic backup --no-cache --host radicale /tmp/backup
              restic forget --no-cache --host radicale --keep-last 7 --prune
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: radicale-backup-settings
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: radicale-backup-settings
                  key: secret-key
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radicale-backup-settings
                  key: restic-password
            - name: RESTIC_REPOSITORY
              value: s3:https://nbg1.your-objectstorage.com/pseud0random-backups/radicale
          volumeMounts:
            - mountPath: /tmp
              name: tmp
          securityContext:
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault

      - name: exit-handler
        steps:
          - - name: scale-up
              arguments:
                parameters:
                  - name: name
                    value: homelab-radicale
                  - name: namespace
                    value: radicale
                  - name: replicaCount
                    value: "1"
                  - name: type
                    value: deployment
              templateRef:
                template: scale-workload
                name: scale-workload
                clusterScope: true
