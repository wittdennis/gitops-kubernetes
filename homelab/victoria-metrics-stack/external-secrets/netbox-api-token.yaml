---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  target:
    name: netbox-api-token
    creationPolicy: Owner
  data:
    - remoteRef:
        conversionStrategy: Default
        key: /victoria-metrics-stack/netbox
        property: api-token
      secretKey: api-token
