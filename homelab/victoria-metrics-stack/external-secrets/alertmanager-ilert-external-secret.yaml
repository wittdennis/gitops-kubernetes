---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-ilert
  namespace: victoria-metrics-stack
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  target:
    name: ilert
    creationPolicy: Owner
  data:
    - remoteRef:
        conversionStrategy: Default
        key: /victoria-metrics-stack/alertmanager/ilert
        property: integration-url
      secretKey: integration-url
    - remoteRef:
        conversionStrategy: Default
        key: /victoria-metrics-stack/alertmanager/ilert
        property: heartbeat-url
      secretKey: heartbeat-url
