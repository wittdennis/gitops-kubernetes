---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: derwitt-site-gateway
  annotations:
    cert-manager.io/cluster-issuer: derwitt-site-cluster-issuer
    cert-manager.io/issue-temporary-certificate: "true"
