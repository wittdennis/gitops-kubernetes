---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: calibre-web-backup
spec:
  schedules:
    - "26 2 * * *"
  concurrencyPolicy: "Replace"
  startingDeadlineSeconds: 0
  successfulJobsHistoryLimit: 1
  workflowSpec:
    entrypoint: main
    onExit: exit-handler
    podMetadata:
      labels:
        network-policy/allow-default-tenant-s3-traffic: apply
        network-policy/allow-kube-apiserver-traffic: apply
        network-policy/allow-backup-egress: apply
    artifactGC:
      strategy: OnWorkflowDeletion
      serviceAccountName: calibre-web-workflows
      podMetadata:
        labels:
          network-policy/allow-default-tenant-s3-traffic: apply
          network-policy/allow-kube-apiserver-traffic: apply
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    serviceAccountName: calibre-web-workflows
    volumes:
      - name: tmp
        emptyDir: {}
      - name: calibre-web-config
        persistentVolumeClaim:
          claimName: homelab-calibre-web-config
          readOnly: true
      - name: calibre-web-books
        persistentVolumeClaim:
          claimName: homelab-calibre-web-books
          readOnly: true
    templates:
      - name: main
        dag:
          tasks:
            - name: scale-down
              arguments:
                parameters:
                  - name: name
                    value: homelab-calibre-web
                  - name: namespace
                    value: calibre-web
                  - name: replicaCount
                    value: "0"
                  - name: type
                    value: deployment
              templateRef:
                template: scale-workload
                name: scale-workload
                clusterScope: true

            - name: copy-data
              dependencies: [scale-down]
              template: copy-data

            - name: upload-backup
              dependencies: [copy-data]
              template: restic
              arguments:
                artifacts:
                  - name: data-backup-archive
                    from: "{{tasks.copy-data.outputs.artifacts.data-backup-archive}}"

      - name: copy-data
        outputs:
          artifacts:
            - name: data-backup-archive
              path: /tmp/calibre-web-data.tar
              s3:
                key: "{{workflow.name}}/calibre-web-data.tar"
        container:
          image: git.derwitt.site/containers/devops-tools:1.3.4 # renovate
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: calibre-web-config
              mountPath: /mnt/calibre-web-config
            - name: calibre-web-books
              mountPath: /mnt/calibre-web-books
          workingDir: /tmp
          command: [sh, -c]
          args:
            - |
              #!/bin/sh
              set -eu

              mkdir -p /tmp/config
              cp -R /mnt/calibre-web-config/. /tmp/config

              mkdir -p /tmp/books
              cp -R /mnt/calibre-web-books/. /tmp/books

              # ebook formats are already compressed and restic compresses the
              # archive again, so packing without xz saves hours of cpu time
              ARCHIVE="/tmp/calibre-web-data.tar"
              echo "Creating archive $ARCHIVE ..."
              tar -cf "$ARCHIVE" -C /tmp config books
              du -sch $ARCHIVE
          securityContext:
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault

      - name: restic
        inputs:
          artifacts:
            - name: data-backup-archive
              path: /tmp/backup/data-backup.tar
        container:
          image: restic/restic:0.19.1 # renovate
          command: [sh, -c]
          args:
            - |
              restic init --no-cache || true
              restic backup --no-cache --host calibre-web /tmp/backup
              restic forget --no-cache --host calibre-web --keep-last 7 --prune
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: calibre-web-backup-settings
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: calibre-web-backup-settings
                  key: secret-key
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: calibre-web-backup-settings
                  key: restic-password
            - name: RESTIC_REPOSITORY
              value: s3:https://nbg1.your-objectstorage.com/pseud0random-backups/calibre-web
          volumeMounts:
            - mountPath: /tmp
              name: tmp
          securityContext:
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault

      - name: exit-handler
        steps:
          - - name: scale-up
              arguments:
                parameters:
                  - name: name
                    value: homelab-calibre-web
                  - name: namespace
                    value: calibre-web
                  - name: replicaCount
                    value: "1"
                  - name: type
                    value: deployment
              templateRef:
                template: scale-workload
                name: scale-workload
                clusterScope: true
