---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mogenius-operator-dev-valkey-client-tls
spec:
  secretName: mogenius-operator-dev-valkey-client-tls
  renewBefore: 720h
  # The ValkeyCluster maps this certificate's CN to an ACL user
  # (clientAuth.certificateUser: CN), so it must match the ACL username.
  commonName: default
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - digital signature
    - key encipherment
    - client auth
  issuerRef:
    name: cluster-ca-issuer
    kind: ClusterIssuer
