---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: modify-argocd-dex-server-redirect-uri-for-mobile-app
  annotations:
    policies.kyverno.io/title: Modify Argo-CD dex-server redirect uri for mobile app
    policies.kyverno.io/category: Security
    policies.kyverno.io/subject: Pod
spec:
  rules:
    - name: modify-argocd-dex-server-redirect-uri-for-mobile-app
      match:
        any:
          - resources:
              kinds:
                - Pod
              names:
                - argocd-dex-server-*
              operations:
                - CREATE
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - name: dex-server
                command:
                  - /bin/sh
                  - -c
                  # dex parses its config once at startup and `argocd-dex rundex`
                  # spawns it immediately after writing /tmp/dex.yaml, so patching
                  # the file from a background loop loses the race. Shadow the dex
                  # binary on PATH instead: rundex resolves it via PATH, which makes
                  # the wrapper the last hook before the config is read. exec keeps
                  # the PID so rundex can still signal dex on settings changes, and
                  # the patch is re-applied on every regenerate/restart cycle.
                  - |
                    set -eu
                    mkdir -p /tmp/bin
                    cat >/tmp/bin/dex <<'EOF'
                    #!/bin/sh
                    for cfg; do :; done
                    grep -q 'argocd://auth/callback' "$cfg" ||
                      sed -i 's|  - http://localhost:8085/auth/callback|  - http://localhost:8085/auth/callback\n  - argocd://auth/callback|' "$cfg"
                    exec /usr/local/bin/dex "$@"
                    EOF
                    chmod +x /tmp/bin/dex
                    PATH=/tmp/bin:$PATH
                    export PATH
                    exec /shared/argocd-dex rundex
