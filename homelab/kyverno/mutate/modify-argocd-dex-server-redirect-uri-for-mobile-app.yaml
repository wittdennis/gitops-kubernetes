---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: modify-argocd-dex-server-redirect-uri-for-mobile-app
  annotations:
    policies.kyverno.io/title: Modify Argo-CD dex-server redirect uri for mobile app
    policies.kyverno.io/category: Security
    policies.kyverno.io/subject: Pod
spec:
  rules:
    - name: modify-argocd-dex-server-redirect-uri-for-mobile-app
      match:
        any:
          - resources:
              kinds:
                - Pod
              names:
                - argocd-dex-server-*
              operations:
                - CREATE
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - name: dex-server
                command:
                  - "/bin/sh"
                  - "-c"
                  - "(LAST=\"\"; while true; do M=$(stat -c %Y /tmp/dex.yaml 2>/dev/null); if [ \"$M\" != \"$LAST\" ]; then LAST=$M; grep -q \"argocd://auth/callback\" /tmp/dex.yaml 2>/dev/null || sed -i \"s|  - http://localhost:8085/auth/callback|  - http://localhost:8085/auth/callback\\n  - argocd://auth/callback|\" /tmp/dex.yaml; fi; sleep 0.2; done) & exec /shared/argocd-dex rundex"
