# yaml-language-server: $schema=https://raw.githubusercontent.com/argoproj/argo-workflows/main/api/jsonschema/schema.json
---
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: scale-workload
spec:
  entrypoint: scale-workload
  artifactGC:
    strategy: OnWorkflowDeletion
    serviceAccountName: foundry-workflows
    podMetadata:
      labels:
        network-policy/allow-default-tenant-s3-traffic: apply
        network-policy/allow-kube-apiserver-traffic: apply
  podGC:
    strategy: OnWorkflowSuccess
  podMetadata:
    labels:
      network-policy/allow-kube-apiserver-traffic: apply
      network-policy/allow-default-tenant-s3-traffic: apply
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  arguments:
    parameters:
      - name: replicaCount
      - name: namespace
      - name: type
        default: deployment
      - name: name
  templates:
    - name: scale-workload
      automountServiceAccountToken: true
      inputs:
        parameters:
          - name: replicaCount
          - name: namespace
          - name: type
          - name: name
      container:
        image: ghcr.io/wittdennis/devops-tools:1.2.40 # renovate
        securityContext:
          capabilities:
            drop:
              - ALL
          runAsGroup: 1000
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        command:
          - sh
          - -c
        args:
          - |
            set -eu

            kubectl scale --replicas={{inputs.parameters.replicaCount}} -n {{inputs.parameters.namespace}} {{inputs.parameters.type}}/{{inputs.parameters.name}}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
