---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-external-secrets-token-requests
  annotations:
    policies.kyverno.io/title: Restrict External Secrets Token Requests
    policies.kyverno.io/description: |
      The external-secrets chart grants its controller cluster-wide serviceaccounts/token create.
      Vault roles bind ServiceAccounts with broader policies than any store, e.g. atlantis/atlantis
      as administrator, so the controller is limited to the eso-* ServiceAccounts its stores use.
spec:
  validationActions: ["Deny"]
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["serviceaccounts/token"]
  matchConditions:
    - name: external-secrets-controller
      expression: request.userInfo.username == "system:serviceaccount:external-secrets:external-secrets"
  validations:
    - expression: request.namespace == "external-secrets" && request.name.startsWith("eso-")
      message: external-secrets may only request tokens for eso-* ServiceAccounts in external-secrets
