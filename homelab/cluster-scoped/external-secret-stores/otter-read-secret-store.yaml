---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend-otter-read
spec:
  provider:
    vault:
      server: "https://vault.hashicorp-vault.svc.cluster.local:8200"
      path: "otter"
      version: "v2"
      caProvider:
        type: Secret
        name: vault-server-cert
        namespace: hashicorp-vault
        key: ca.crt
      auth:
        # Separate from the push token deliberately: that one writes the certificate and
        # nothing else, this one reads the endpoint token and nothing else.
        tokenSecretRef:
          name: "vault-otter-read-token"
          namespace: external-secrets
          key: "token"
