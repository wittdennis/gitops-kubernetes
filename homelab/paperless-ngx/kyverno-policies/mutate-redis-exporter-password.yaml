---
apiVersion: policies.kyverno.io/v1
kind: NamespacedMutatingPolicy
metadata:
  name: mutate-redis-exporter-password
  annotations:
    policies.kyverno.io/title: Modify valkey pod redis-exporter environment variables
    policies.kyverno.io/category: Mutation
    policies.kyverno.io/subject: Pod
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: is-valkey-pod
      expression: >-
        (has(object.metadata.name) && object.metadata.name.startsWith('paperless-ngx-valkey-')) ||
        (has(object.metadata.generateName) && object.metadata.generateName.startsWith('paperless-ngx-valkey-'))
    # The apply configuration would otherwise add a bare metrics container.
    - name: has-metrics-container
      expression: object.spec.containers.exists(c, c.name == 'metrics')
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              containers: [
                Object.spec.containers{
                  name: "metrics",
                  env: [
                    Object.spec.containers.env{
                      name: "REDIS_PASSWORD",
                      valueFrom: Object.spec.containers.env.valueFrom{
                        secretKeyRef: Object.spec.containers.env.valueFrom.secretKeyRef{
                          name: "paperless-ngx-valkey-credentials",
                          key: "default-password"
                        }
                      }
                    }
                  ]
                }
              ]
            }
          }
