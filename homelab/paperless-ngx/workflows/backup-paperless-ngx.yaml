---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: paperless-ngx-backup
spec:
  schedules:
    - "46 4 * * *"
  concurrencyPolicy: "Replace"
  startingDeadlineSeconds: 0
  successfulJobsHistoryLimit: 1
  workflowSpec:
    entrypoint: main
    onExit: exit-handler
    podMetadata:
      labels:
        network-policy/allow-default-tenant-s3-traffic: apply
        network-policy/allow-kube-apiserver-traffic: apply
        network-policy/allow-backup-egress: apply
    artifactGC:
      strategy: OnWorkflowDeletion
      serviceAccountName: paperless-ngx-workflows
      podMetadata:
        labels:
          network-policy/allow-default-tenant-s3-traffic: apply
          network-policy/allow-kube-apiserver-traffic: apply
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    serviceAccountName: paperless-ngx-workflows
    volumes:
      - name: tmp
        emptyDir: {}
    templates:
      - name: main
        dag:
          tasks:
            - name: scale-down
              arguments:
                parameters:
                  - name: name
                    value: homelab-paperless-ngx
                  - name: namespace
                    value: paperless-ngx
                  - name: replicaCount
                    value: "0"
                  - name: type
                    value: deployment
              templateRef:
                template: scale-workload
                name: scale-workload
                clusterScope: true

            - name: retrieve-db-backup
              dependencies: [scale-down]
              template: retrieve-db-backups

            # data/media are read straight by restic: documents only grow and are never
            # rewritten once ingested, so incremental snapshots stay cheap
            - name: upload-backup
              dependencies: [scale-down, retrieve-db-backup]
              templateRef:
                template: restic-backup
                name: restic-backup
                clusterScope: true
              arguments:
                parameters:
                  - name: host
                    value: paperless-ngx
                  - name: repository
                    value: s3:https://nbg1.your-objectstorage.com/pseud0random-backups/paperless-ngx
                  - name: secretName
                    value: paperless-ngx-backup-settings
                  - name: paths
                    value: /mnt/paperless-ngx-data /mnt/paperless-ngx-media /tmp/stage
                  - name: retention
                    value: --keep-daily 7 --keep-weekly 4 --keep-monthly 6
                  - name: podSpecPatch
                    value: |
                      volumes:
                        - name: paperless-ngx-data
                          persistentVolumeClaim:
                            claimName: homelab-paperless-ngx-data
                            readOnly: true
                        - name: paperless-ngx-media
                          persistentVolumeClaim:
                            claimName: homelab-paperless-ngx-media
                            readOnly: true
                      containers:
                        - name: main
                          volumeMounts:
                            - name: paperless-ngx-data
                              mountPath: /mnt/paperless-ngx-data
                              readOnly: true
                            - name: paperless-ngx-media
                              mountPath: /mnt/paperless-ngx-media
                              readOnly: true
                artifacts:
                  - name: stage
                    from: "{{tasks.retrieve-db-backup.outputs.artifacts.db-backup-archive}}"

      - name: retrieve-db-backups
        outputs:
          artifacts:
            - name: db-backup-archive
              path: /tmp/paperless-ngx-postgres.tar.xz
              s3:
                key: "{{workflow.name}}/paperless-ngx-postgres.tar.xz"
        container:
          image: git.derwitt.site/containers/devops-tools:1.3.4 # renovate
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          workingDir: /tmp
          command: [sh, -c]
          args:
            - |
              #!/bin/sh
              set -eu

              S3_PREFIX="s3://postgres-backups/paperless-ngx-postgres"
              ARCHIVE_NAME="paperless-ngx-postgres.tar.xz"
              mkdir backups

              echo "Downloading from ${S3_PREFIX} ..."
              aws s3 cp --recursive "$S3_PREFIX" backups

              ls -la .

              echo "Creating archive ${ARCHIVE_NAME} ..."
              tar -cJf "$ARCHIVE_NAME" -C backups .

              echo "Done: ${ARCHIVE_NAME}"
              du -sch ${ARCHIVE_NAME}
          env:
            - name: AWS_DEFAULT_REGION
              value: homelab
            - name: AWS_ENDPOINT_URL
              value: http://homelab-garage-headless.storage.svc.cluster.local:3900
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: postgres-backups-read-credentials
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: postgres-backups-read-credentials
                  key: secret-key
          securityContext:
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault

      - name: exit-handler
        steps:
          - - name: scale-up
              arguments:
                parameters:
                  - name: name
                    value: homelab-paperless-ngx
                  - name: namespace
                    value: paperless-ngx
                  - name: replicaCount
                    value: "1"
                  - name: type
                    value: deployment
              templateRef:
                template: scale-workload
                name: scale-workload
                clusterScope: true
