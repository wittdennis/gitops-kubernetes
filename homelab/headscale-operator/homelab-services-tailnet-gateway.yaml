---
apiVersion: headscale.mogenius.com/v1alpha1
kind: TailnetGateway
metadata:
  name: homelab-services
spec:
  headscaleInstanceRef: personal-vpn
  user: infra
  namespace: headscale-operator
  hostname: homelab-services
  ephemeral: false
  keyExpiry: 24h
  image: ghcr.io/tailscale/tailscale:v1.104.4 # renovate
  proxyImage: docker.io/library/nginx:1.31.8 # renovate
  tags:
    - tag:k8s-homelab-service
  resources:
    requests:
      memory: 64Mi
