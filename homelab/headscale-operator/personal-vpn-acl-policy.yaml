---
apiVersion: headscale.mogenius.com/v1alpha1
kind: ACLPolicy
metadata:
  name: personal-vpn-acl-policy
spec:
  headscaleInstanceRef: personal-vpn
  tagOwners:
    "tag:hypervisor": ["infra@"]
    "tag:parents": ["infra@"]
    "tag:ansible": ["infra@"]
    "tag:dns": ["infra@"]
    "tag:k8s-home-assistant-service": ["infra@"]
    "tag:k8s-homelab-service": ["infra@"]
    "tag:home-assistant": ["infra@"]
    "tag:hetzner": ["infra@"]
    "tag:exit-node": ["infra@"]
    "tag:loadbalancer": ["infra@"]
    "tag:headscale": ["infra@"]
    "tag:forgejo": ["infra@"]
  autoApprovers:
    exitNode: ["tag:exit-node"]
  nodeAttrs:
    - target: ["*"]
      attr: ["suggest-exit-node", "suggest-exit-node-ui"]
  grants:
    # Full mesh for the core tailnet: everyone except tag:parents and tag:home-assistant.
    # tag:dns is only a dst: it never initiates connections.
    - src:
        [
          "autogroup:member",
          "tag:hypervisor",
          "tag:ansible",
          "tag:loadbalancer",
        ]
      dst:
        [
          "autogroup:member",
          "tag:hypervisor",
          "tag:ansible",
          "tag:dns",
          "tag:loadbalancer",
          "tag:headscale",
          "tag:forgejo",
        ]
      ip: ["*"]
    # Peer visibility is bidirectional, so this puts every node in tag:dns's netmap
    # and its MagicDNS resolves the whole tailnet without tag:dns needing outbound access.
    - src: ["*"]
      dst: ["tag:dns"]
      ip: ["udp:53", "tcp:53"]
    - src: ["autogroup:member", "tag:ansible"]
      dst: ["tag:parents"]
      ip: ["*"]
    # One-way: tag:home-assistant is only a src towards tag:dns:53.
    - src: ["autogroup:member", "tag:hypervisor", "tag:ansible"]
      dst: ["tag:home-assistant"]
      ip: ["*"]
    # One-way: tag:hetzner is only a src for the loadbalancer and k8s-*-service grants below.
    - src:
        [
          "autogroup:member",
          "tag:hypervisor",
          "tag:ansible",
          "tag:loadbalancer",
          "tag:headscale",
        ]
      dst: ["tag:hetzner"]
      ip: ["*"]
    - src: ["tag:hetzner", "tag:headscale"]
      dst: ["tag:loadbalancer", "tag:hetzner"]
      ip: ["*"]
    # Container image pulls from the forgejo registry.
    - src: ["tag:hetzner", "tag:headscale"]
      dst: ["tag:forgejo"]
      ip: ["tcp:443"]
    # One-way: tag:k8s-home-assistant-service is only a src towards tag:dns:53.
    - src: ["autogroup:member", "tag:hypervisor", "tag:ansible", "tag:hetzner"]
      dst: ["tag:k8s-home-assistant-service"]
      ip: ["tcp:443"]
    # One-way: tag:k8s-homelab-service is only a src towards tag:dns:53.
    - src: ["autogroup:member", "tag:hypervisor", "tag:ansible", "tag:hetzner"]
      dst: ["tag:k8s-homelab-service"]
      ip: ["tcp:443"]
    - src: ["autogroup:member", "tag:ansible"]
      dst: ["tag:exit-node"]
      ip: ["*"]
    # The exit node's vmagent scrapes node_exporters over the tailnet.
    - src: ["tag:exit-node"]
      dst: ["tag:parents", "tag:loadbalancer", "tag:hetzner"]
      ip: ["*"]
    # Internet egress via the exit node is limited to users' own untagged devices.
    - src: ["autogroup:member"]
      dst: ["autogroup:internet"]
      ip: ["*"]
