---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: audiobookshelf-backup
spec:
  schedules:
    - "56 2 * * *"
  concurrencyPolicy: "Replace"
  startingDeadlineSeconds: 0
  successfulJobsHistoryLimit: 1
  workflowSpec:
    entrypoint: main
    onExit: exit-handler
    podMetadata:
      labels:
        network-policy/allow-default-tenant-s3-traffic: apply
        network-policy/allow-kube-apiserver-traffic: apply
        network-policy/allow-backup-egress: apply
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    serviceAccountName: audiobookshelf-workflows
    templates:
      - name: main
        dag:
          tasks:
            # the volumes are ReadWriteOnce and the sqlite database must not be copied while
            # the server writes to it
            - name: scale-down
              arguments:
                parameters:
                  - name: name
                    value: homelab-audiobookshelf
                  - name: namespace
                    value: audiobookshelf
                  - name: replicaCount
                    value: "0"
                  - name: type
                    value: deployment
              templateRef:
                template: scale-workload
                name: scale-workload
                clusterScope: true

            # restic reads the volumes directly; audio files never change once imported, so
            # incremental snapshots stay cheap and no archive staging is needed
            - name: backup
              dependencies: [scale-down]
              templateRef:
                template: restic-backup
                name: restic-backup
                clusterScope: true
              arguments:
                parameters:
                  - name: host
                    value: audiobookshelf
                  - name: repository
                    value: s3:https://nbg1.your-objectstorage.com/pseud0random-backups/audiobookshelf
                  - name: secretName
                    value: audiobookshelf-backup-settings
                  - name: paths
                    value: /mnt/config /mnt/metadata /mnt/media
                  # metadata/backups holds audiobookshelf's own freshly compressed backup
                  # archives, which would deduplicate against nothing
                  - name: excludes
                    value: --exclude /mnt/metadata/backups
                  - name: retention
                    value: --keep-daily 7 --keep-weekly 4 --keep-monthly 6
                  - name: podSpecPatch
                    value: |
                      volumes:
                        - name: config
                          persistentVolumeClaim:
                            claimName: homelab-audiobookshelf-config
                            readOnly: true
                        - name: metadata
                          persistentVolumeClaim:
                            claimName: homelab-audiobookshelf-metadata
                            readOnly: true
                        - name: media
                          persistentVolumeClaim:
                            claimName: homelab-audiobookshelf-media
                            readOnly: true
                      containers:
                        - name: main
                          volumeMounts:
                            - name: config
                              mountPath: /mnt/config
                              readOnly: true
                            - name: metadata
                              mountPath: /mnt/metadata
                              readOnly: true
                            - name: media
                              mountPath: /mnt/media
                              readOnly: true

      - name: exit-handler
        steps:
          - - name: scale-up
              arguments:
                parameters:
                  - name: name
                    value: homelab-audiobookshelf
                  - name: namespace
                    value: audiobookshelf
                  - name: replicaCount
                    value: "1"
                  - name: type
                    value: deployment
              templateRef:
                template: scale-workload
                name: scale-workload
                clusterScope: true
