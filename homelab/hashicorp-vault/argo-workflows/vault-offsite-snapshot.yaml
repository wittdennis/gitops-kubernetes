# yaml-language-server: $schema=https://raw.githubusercontent.com/argoproj/argo-workflows/main/api/jsonschema/schema.json
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: vault-offsite-snapshot
spec:
  schedules:
    - "0 0 * * *"
  concurrencyPolicy: "Replace"
  startingDeadlineSeconds: 0
  successfulJobsHistoryLimit: 7
  workflowSpec:
    entrypoint: backup
    serviceAccountName: vault
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    artifactGC:
      strategy: OnWorkflowDeletion
      serviceAccountName: vault
      podSpecPatch: |
        securityContext:
          seccompProfile:
            type: RuntimeDefault
    templates:
      - name: backup
        steps:
          - - name: create-snapshot
              template: snapshot
          - - name: upload-snapshot
              templateRef:
                template: restic-backup
                name: restic-backup
                clusterScope: true
              arguments:
                parameters:
                  - name: host
                    value: vault
                  - name: repository
                    value: s3:https://nbg1.your-objectstorage.com/pseud0random-backups/vault-homelab
                  - name: secretName
                    value: vault-backup-settings
                  - name: paths
                    value: /tmp/stage
                  - name: retention
                    value: --keep-last 90
                artifacts:
                  - name: stage
                    from: "{{steps.create-snapshot.outputs.artifacts.vault-snapshot}}"

      - name: snapshot
        automountServiceAccountToken: true
        serviceAccountName: vault
        outputs:
          artifacts:
            - name: vault-snapshot
              path: /tmp/backup.snap
              s3:
                key: "{{workflow.name}}/backup.snap"
        securityContext:
          fsGroup: 1000
          runAsGroup: 1000
          runAsUser: 1000
          runAsNonRoot: true
          fsGroupChangePolicy: "OnRootMismatch"
          seccompProfile:
            type: RuntimeDefault
        container:
          image: hashicorp/vault:2.1.1 # renovate
          command: [sh, -c]
          args:
            - |
              echo "Getting service account token"
              export JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)

              echo "Logging into vault service account"
              export VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login role="vault-snapshot-role" jwt="${JWT}")

              echo "Taking snapshot"
              vault operator raft snapshot save /tmp/backup.snap
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - mountPath: /vault/userconfig/vault-server-cert
              name: vault-server-cert
              readOnly: true
          env:
            - name: VAULT_ADDR
              value: https://vault-active.hashicorp-vault.svc.cluster.local:8200
            - name: VAULT_CACERT
              value: /vault/userconfig/vault-server-cert/ca.crt
          securityContext:
            runAsGroup: 1000
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        volumes:
          - name: tmp
            emptyDir: {}
          - name: vault-server-cert
            secret:
              defaultMode: 420
              secretName: vault-server-cert
