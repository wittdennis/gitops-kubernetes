---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-homelab-tailnet
spec:
  hostnames:
    - vault-homelab.tailnet.derwitt.site
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab-services-tailnet-gateway
      namespace: headscale-operator
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: vault-active
          port: 8200
          weight: 100
      matches:
        - path:
            type: PathPrefix
            value: /
