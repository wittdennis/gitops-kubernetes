---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  target:
    name: atlantis-config
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - remoteRef:
        conversionStrategy: Default
        key: /atlantis/forgejo
        property: user-token
      secretKey: forgejo-user-token
    - remoteRef:
        conversionStrategy: Default
        key: /atlantis/forgejo
        property: webhook-secret
      secretKey: forgejo-webhook-secret
