---
apiVersion: policies.kyverno.io/v1
kind: NamespacedMutatingPolicy
metadata:
  name: mutate-redis-exporter-password
  annotations:
    policies.kyverno.io/title: Modify valkey pod redis-exporter environment variables
    policies.kyverno.io/category: Mutation
    policies.kyverno.io/subject: Pod
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: is-valkey-pod
      expression: >-
        (has(object.metadata.name) && object.metadata.name.startsWith('netbox-valkey-')) ||
        (has(object.metadata.generateName) && object.metadata.generateName.startsWith('netbox-valkey-'))
    # The apply configuration would otherwise add a bare metrics container.
    - name: has-metrics-container
      expression: object.spec.containers.exists(c, c.name == 'metrics')
  variables:
    - name: idx
      expression: object.spec.containers.map(c, c.name).indexOf("metrics")
    - name: env
      expression: >-
        Object.spec.containers.env{
          name: "REDIS_PASSWORD",
          valueFrom: Object.spec.containers.env.valueFrom{
            secretKeyRef: Object.spec.containers.env.valueFrom.secretKeyRef{
              name: "netbox-valkey-credentials",
              key: "default-password"
            }
          }
        }
  mutations:
    # secretKeyRef is an atomic struct, which ApplyConfiguration may not touch.
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          has(object.spec.containers[variables.idx].env)
          ? [JSONPatch{op: "add", path: "/spec/containers/" + string(variables.idx) + "/env/-", value: variables.env}]
          : [JSONPatch{op: "add", path: "/spec/containers/" + string(variables.idx) + "/env", value: [variables.env]}]
