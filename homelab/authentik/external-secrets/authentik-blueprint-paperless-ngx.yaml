---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-paperless-ngx
spec:
  refreshInterval: "1h0m0s"
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-paperless-ngx
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        paperless-ngx.yaml: |
          version: 1
          metadata:
            name: derwitt-site-paperless-ngx
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              state: present
              id: paperless_ngx_provider
              identifiers:
                client_id: paperless_ngx
              attrs:
                name: Paperless-ngx
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
                redirect_uris:
                  - matching_mode: strict
                    url: https://documents.derwitt.site/accounts/oidc/authentik/login/callback/
                    redirect_uri_type: authorization
                include_claims_in_id_token: true
                sub_mode: hashed_user_id
                client_secret: "{{ .clientSecret }}"
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, "Derwitt Signing Key (ECDSA)"]]
            - model: authentik_core.application
              state: present
              id: paperless_ngx_application
              identifiers:
                slug: paperless_ngx
              attrs:
                name: paperless_ngx
                provider: !KeyOf paperless_ngx_provider
                meta_launch_url: https://documents.derwitt.site
                policy_engine_mode: any
            - model: authentik_policies.policybinding
              state: present
              identifiers:
                target: !KeyOf paperless_ngx_application
                group: !Find [authentik_core.group, [name, "Paperless Users"]]
              attrs:
                order: 0
            - model: authentik_policies.policybinding
              state: present
              identifiers:
                target: !KeyOf paperless_ngx_application
                group: !Find [authentik_core.group, [name, "Paperless Admins"]]
              attrs:
                order: 1
  data:
    - remoteRef:
        conversionStrategy: Default
        key: authentik/oauth2-clients/paperless-ngx
        property: client-secret
      secretKey: clientSecret
