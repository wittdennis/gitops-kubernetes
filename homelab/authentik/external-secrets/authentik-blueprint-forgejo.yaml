---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-forgejo
spec:
  refreshInterval: "1h0m0s"
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-forgejo
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        forgejo.yaml: |
          version: 1
          metadata:
            name: derwitt-site-forgejo
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              state: present
              id: forgejo_provider
              identifiers:
                client_id: forgejo
              attrs:
                name: Forgejo
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
                redirect_uris:
                  - matching_mode: strict
                    url: https://git.derwitt.site/user/oauth2/Authentik/callback
                    redirect_uri_type: authorization
                include_claims_in_id_token: true
                sub_mode: hashed_user_id
                client_secret: "{{ .clientSecret }}"
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [name, forgejo]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, "Derwitt Signing Key (ECDSA)"]]
            - model: authentik_core.application
              state: present
              id: forgejo_application
              identifiers:
                slug: forgejo
              attrs:
                name: Forgejo
                protocol_provider: !KeyOf forgejo_provider
                meta_launch_url: https://git.derwitt.site
                policy_engine_mode: any
            - model: authentik_policies.policybinding
              state: present
              identifiers:
                target: !KeyOf forgejo_application
                group: !Find [authentik_core.group, [name, "SuperUsers"]]
              attrs:
                order: 0
            - model: authentik_policies.policybinding
              state: present
              identifiers:
                target: !KeyOf forgejo_application
                group: !Find [authentik_core.group, [name, "VCS Admins"]]
              attrs:
                order: 1
            - model: authentik_policies.policybinding
              state: present
              identifiers:
                target: !KeyOf forgejo_application
                group: !Find [authentik_core.group, [name, "VCS Users"]]
              attrs:
                order: 2
            - model: authentik_policies.policybinding
              state: present
              identifiers:
                target: !KeyOf forgejo_application
                group: !Find [authentik_core.group, [name, "VCS Restricted Users"]]
              attrs:
                order: 2
  data:
    - remoteRef:
        conversionStrategy: Default
        key: authentik/oauth2-clients/forgejo
        property: client-secret
      secretKey: clientSecret
