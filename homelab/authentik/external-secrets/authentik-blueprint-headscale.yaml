---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-headscale
spec:
  refreshInterval: "1h0m0s"
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-headscale
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        headscale.yaml: |
          version: 1
          metadata:
            name: derwitt-site-headscale
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              state: present
              id: headscale_provider
              identifiers:
                client_id: headscale
              attrs:
                name: Headscale
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
                grant_types:
                  - authorization_code
                  - refresh_token
                redirect_uris:
                  - matching_mode: strict
                    url: https://headscale.derwitt.dev/admin/oidc/callback
                    redirect_uri_type: authorization
                include_claims_in_id_token: true
                sub_mode: hashed_user_id
                client_secret: "{{ .clientSecret }}"
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [name, "scope-email"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, "Derwitt Signing Key (RSA)"]]
            - model: authentik_core.application
              state: present
              id: headscale_application
              identifiers:
                slug: headscale
              attrs:
                name: Headscale
                provider: !KeyOf headscale_provider
                meta_launch_url: https://headscale.derwitt.dev/admin
                policy_engine_mode: any
            # The Headplane UI has no groups/roles claim - it only recognises the first OIDC login as Owner
            # and leaves everyone else as Member until an existing admin promotes them in its Users UI.
            # These bindings only gate who can authenticate at all, they do not grant Headplane roles.
            - model: authentik_policies.policybinding
              state: present
              identifiers:
                target: !KeyOf headscale_application
                group: !Find [authentik_core.group, [name, "SuperUsers"]]
              attrs:
                order: 0
            - model: authentik_policies.policybinding
              state: present
              identifiers:
                target: !KeyOf headscale_application
                group: !Find [authentik_core.group, [name, "Headscale Admins"]]
              attrs:
                order: 1
            - model: authentik_policies.policybinding
              state: present
              identifiers:
                target: !KeyOf headscale_application
                group: !Find [authentik_core.group, [name, "Headscale Users"]]
              attrs:
                order: 2
  data:
    - remoteRef:
        conversionStrategy: Default
        key: authentik/oauth2-clients/headscale
        property: client-secret
      secretKey: clientSecret
