---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-argo-workflows
spec:
  refreshInterval: "1h0m0s"
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-argo-workflows
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        argo-workflows.yaml: |
          version: 1
          metadata:
            name: derwitt-site-argo-workflows
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              state: present
              id: argo_workflows_provider
              identifiers:
                client_id: argo-workflows
              attrs:
                name: Argo Workflows
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
                allowed_redirect_uris:
                  - matching_mode: strict
                    url: https://workflows.derwitt.site/oauth2/callback
                    redirect_uri_type: authorization
                  - matching_mode: strict
                    url: https://workflows.home-assistant.derwitt.site/oauth2/callback
                    redirect_uri_type: authorization
                  - matching_mode: strict
                    url: https://workflows.derwitt.dev/oauth2/callback
                    redirect_uri_type: authorization
                include_claims_in_id_token: true
                sub_mode: hashed_user_id
                client_secret: "{{ .clientSecret }}"
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, "Derwitt Signing Key (ECDSA)"]]
            - model: authentik_core.application
              state: present
              id: argo_workflows_application
              identifiers:
                slug: argo-workflows
              attrs:
                name: Argo Workflows
                protocol_provider: !KeyOf argo_workflows_provider
                policy_engine_mode: any
            - model: authentik_policies.policybinding
              state: present
              identifiers:
                target: !KeyOf argo_workflows_application
                group: !Find [authentik_core.group, [name, "Argo Workflows Admins"]]
              attrs:
                order: 0
  data:
    - remoteRef:
        conversionStrategy: Default
        key: authentik/oauth2-clients/argo-workflows
        property: client-secret
      secretKey: clientSecret
