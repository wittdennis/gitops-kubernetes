---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-vault
spec:
  refreshInterval: "1h0m0s"
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-vault
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        vault.yaml: |
          version: 1
          metadata:
            name: derwitt-site-vault
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              state: present
              id: vault_provider
              identifiers:
                client_id: vault
              attrs:
                name: Hashicorp Vault
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
                grant_types:
                  - authorization_code
                  - refresh_token
                redirect_uris:
                  - matching_mode: strict
                    url: https://vault.derwitt.site/ui/vault/auth/oidc/oidc/callback
                    redirect_uri_type: authorization
                  - matching_mode: strict
                    url: https://vault.derwitt.dev/ui/vault/auth/oidc/oidc/callback
                    redirect_uri_type: authorization
                  - matching_mode: strict
                    url: https://vault.derwitt.dev/oidc/callback
                    redirect_uri_type: authorization
                include_claims_in_id_token: true
                sub_mode: hashed_user_id
                client_secret: "{{ .clientSecret }}"
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, "Derwitt Signing Key (RSA)"]]
            - model: authentik_core.application
              state: present
              id: vault_application
              identifiers:
                slug: vault
              attrs:
                name: Vault
                provider: !KeyOf vault_provider
                meta_launch_url: https://vault.derwitt.site
                policy_engine_mode: any
            - model: authentik_policies.policybinding
              state: present
              identifiers:
                target: !KeyOf vault_application
                group: !Find [authentik_core.group, [name, "Vault Admins"]]
              attrs:
                order: 0
            - model: authentik_policies.policybinding
              state: present
              identifiers:
                target: !KeyOf vault_application
                group: !Find [authentik_core.group, [name, "Vault Readers"]]
              attrs:
                order: 1
  data:
    - remoteRef:
        conversionStrategy: Default
        key: authentik/oauth2-clients/vault
        property: client-secret
      secretKey: clientSecret
