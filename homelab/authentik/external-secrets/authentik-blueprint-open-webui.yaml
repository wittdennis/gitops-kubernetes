---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-open-webui
spec:
  refreshInterval: "1h0m0s"
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-open-webui
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        open-webui.yaml: |
          version: 1
          metadata:
            name: derwitt-site-open-webui
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              state: present
              id: open_webui_provider
              identifiers:
                client_id: open-webui
              attrs:
                name: Open WebUI
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
                grant_types:
                  - authorization_code
                  - refresh_token
                redirect_uris:
                  - matching_mode: strict
                    url: https://chat.derwitt.site/oauth/oidc/callback
                    redirect_uri_type: authorization
                include_claims_in_id_token: true
                sub_mode: hashed_user_id
                client_secret: "{{ .clientSecret }}"
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, "Derwitt Signing Key (RSA)"]]
            - model: authentik_core.application
              state: present
              id: open_webui_application
              identifiers:
                slug: open-webui
              attrs:
                name: Open WebUI
                provider: !KeyOf open_webui_provider
                meta_launch_url: https://chat.derwitt.site
                policy_engine_mode: any
            - model: authentik_policies.policybinding
              state: present
              identifiers:
                target: !KeyOf open_webui_application
                group: !Find [authentik_core.group, [name, "SuperUsers"]]
              attrs:
                order: 0
  data:
    - remoteRef:
        conversionStrategy: Default
        key: authentik/oauth2-clients/open-webui
        property: client-secret
      secretKey: clientSecret
