---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-linkwarden
spec:
  refreshInterval: "1h0m0s"
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-linkwarden
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        linkwarden.yaml: |
          version: 1
          metadata:
            name: derwitt-site-linkwarden
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              state: present
              id: linkwarden_provider
              identifiers:
                client_id: linkwarden
              attrs:
                name: Linkwarden
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
                redirect_uris:
                  - matching_mode: strict
                    url: https://links.derwitt.site/api/v1/auth/callback/authentik
                    redirect_uri_type: authorization
                include_claims_in_id_token: true
                sub_mode: hashed_user_id
                client_secret: "{{ .clientSecret }}"
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, "Derwitt Signing Key (RSA)"]]
            - model: authentik_core.application
              state: present
              id: linkwarden_application
              identifiers:
                slug: linkwarden
              attrs:
                name: Linkwarden
                protocol_provider: !KeyOf linkwarden_provider
                meta_launch_url: https://links.derwitt.site
                policy_engine_mode: all
            - model: authentik_policies.policybinding
              state: present
              identifiers:
                target: !KeyOf linkwarden_application
                group: !Find [authentik_core.group, [name, "Linkwarden Users"]]
              attrs:
                order: 0
  data:
    - remoteRef:
        conversionStrategy: Default
        key: authentik/oauth2-clients/linkwarden
        property: client-secret
      secretKey: clientSecret
