# yaml-language-server: $schema=https://raw.githubusercontent.com/argoproj/argo-workflows/main/api/jsonschema/schema.json
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: authentik-signing-cert-expiry-check
spec:
  schedules:
    - "0 5 * * *"
  concurrencyPolicy: "Replace"
  startingDeadlineSeconds: 0
  successfulJobsHistoryLimit: 7
  workflowSpec:
    entrypoint: check
    serviceAccountName: authentik-workflows
    podMetadata:
      labels:
        network-policy/allow-kube-apiserver-traffic: apply
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    volumes:
      - name: signing-certs
        secret:
          secretName: authentik-signing-certs
    templates:
      - name: check
        container:
          image: git.derwitt.site/containers/devops-tools:1.3.3 # renovate
          command: [sh, -c]
          args:
            - |
              #!/bin/sh
              set -u

              # authentik has no built-in alerting for custom signing-cert expiry (only default
              # certs get auto-renewed) - fail on purpose within the warning window so the existing
              # ArgoWorkflowFailed rule pages us; rotate by regenerating the cert/key, writing it to
              # platform/authentik/signing-keys/<name> in Vault, and letting the blueprint re-apply
              THRESHOLD_DAYS=60
              STATUS=0

              for f in /certs/*.crt; do
                name=$(basename "$f" .crt)
                enddate=$(openssl x509 -in "$f" -noout -enddate | cut -d= -f2)
                if openssl x509 -in "$f" -noout -checkend $((THRESHOLD_DAYS * 86400)); then
                  echo "OK: $name expires $enddate (more than $THRESHOLD_DAYS days away)"
                else
                  echo "EXPIRING SOON: $name expires $enddate (within $THRESHOLD_DAYS days) - rotate this signing cert and update platform/authentik/signing-keys/$name in Vault"
                  STATUS=1
                fi
              done

              exit $STATUS
          volumeMounts:
            - name: signing-certs
              mountPath: /certs
              readOnly: true
          securityContext:
            runAsGroup: 1000
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
