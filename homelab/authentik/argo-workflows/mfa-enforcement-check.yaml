# yaml-language-server: $schema=https://raw.githubusercontent.com/argoproj/argo-workflows/main/api/jsonschema/schema.json
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: authentik-mfa-enforcement-check
spec:
  schedules:
    - "30 5 * * *"
  concurrencyPolicy: "Replace"
  startingDeadlineSeconds: 0
  successfulJobsHistoryLimit: 7
  workflowSpec:
    entrypoint: check
    serviceAccountName: authentik-workflows
    podMetadata:
      labels:
        network-policy/allow-kube-apiserver-traffic: apply
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    volumes:
      - name: api-token
        secret:
          secretName: authentik-mfa-check-token
    templates:
      - name: check
        container:
          image: git.derwitt.site/containers/devops-tools:1.3.1 # renovate
          command: [python3, -c]
          args:
            - |
              # 2FA enforcement lives in attrs patched onto authentik's own default
              # stages (authentik-blueprint-mfa), so it can drift in three ways this
              # asserts against: an upstream release setting those attrs itself, our
              # blueprint creating an unbound duplicate after an upstream rename, and
              # someone editing the stage in the admin UI. failing on purpose lets the
              # existing ArgoWorkflowFailed rule page us
              import json
              import sys
              import urllib.request

              API = "http://authentik-server.authentik.svc.cluster.local/api/v3"
              VALIDATE_MODEL = "authentik_stages_authenticator_validate.authenticatorvalidatestage"
              IDENTIFICATION_MODEL = "authentik_stages_identification.identificationstage"
              ALLOWED_DEVICE_CLASSES = {"webauthn", "totp", "static"}
              ALLOWED_CONFIGURATION_STAGES = {
                  "authentik_stages_authenticator_webauthn.authenticatorwebauthnstage",
                  "authentik_stages_authenticator_totp.authenticatortotpstage",
              }
              # everything else the passwordless flow may bind next to the validation stage
              PASSWORDLESS_ALLOWED_MODELS = {"authentik_stages_user_login.userloginstage"}
              # authentik ships exactly one policy on this binding, skipping validation when
              # the user already authenticated passwordless via WebAuthn
              EXPECTED_STAGE_POLICIES = {"default-authentication-flow-authenticator-validate-stage"}

              with open("/api-token/token") as handle:
                  TOKEN = handle.read().strip()

              BLUEPRINT = "derwitt-site-mfa"

              failures = []


              def get(path):
                  request = urllib.request.Request(
                      f"{API}/{path}", headers={"Authorization": f"Bearer {TOKEN}"}
                  )
                  # transport and auth errors are left to raise - a check that cannot
                  # read the config must not report success
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)


              def check(ok, message):
                  print(f"{'OK  ' if ok else 'FAIL'}: {message}")
                  if not ok:
                      failures.append(message)


              # a blueprint that fails to validate applies none of its entries and leaves the
              # previous config in place, so every assertion below can pass while the committed
              # one was never live
              instances = get(f"managed/blueprints/?name={BLUEPRINT}")["results"]
              check(len(instances) == 1, f"blueprint {BLUEPRINT} is known (found {len(instances)})")
              for instance in instances:
                  check(instance["enabled"], f"blueprint {BLUEPRINT} is enabled")
                  check(
                      instance["status"] == "successful",
                      f"blueprint {BLUEPRINT} applied cleanly (status={instance['status']})",
                  )

              brands = get("core/brands/?default=true")["results"]
              check(len(brands) == 1, f"exactly one default brand exists (found {len(brands)})")
              flow_pk = brands[0]["flow_authentication"] if brands else None
              check(bool(flow_pk), "default brand has an authentication flow")
              if not flow_pk:
                  sys.exit(1)

              # flows are retrieved by slug, so the brand's uuid has to go through the filter
              flows = get(f"flows/instances/?flow_uuid={flow_pk}")["results"]
              flow_slug = flows[0]["slug"] if flows else flow_pk
              flow_bindings = [
                  binding
                  for binding in get(f"flows/bindings/?target={flow_pk}")["results"]
                  if binding["target"] == flow_pk
              ]
              bindings = [
                  binding
                  for binding in flow_bindings
                  if binding["stage_obj"]["meta_model_name"] == VALIDATE_MODEL
              ]
              check(bool(bindings), f"flow {flow_slug} has an MFA validation stage bound")

              for binding in bindings:
                  stage = get(f"stages/authenticator/validate/{binding['stage']}/")
                  name = stage["name"]
                  action = stage["not_configured_action"]
                  check(
                      action != "skip",
                      f"{name}: users without a device are not let through (not_configured_action={action})",
                  )
                  weak = sorted(set(stage["device_classes"]) - ALLOWED_DEVICE_CLASSES)
                  check(not weak, f"{name}: device classes limited to strong factors (extra: {weak})")
                  check(
                      stage["webauthn_user_verification"] == "required",
                      f"{name}: webauthn_user_verification is required",
                  )
                  # a policy bound here that returns false skips the stage entirely, so
                  # anything beyond the shipped one is treated as a bypass, as is a
                  # group/user binding (which would scope MFA to that group alone)
                  bound = get(f"policies/bindings/?target={binding['policybindingmodel_ptr_id']}")
                  unexpected = sorted(
                      policy["policy_obj"]["name"]
                      if policy["policy_obj"]
                      else f"group/user binding {policy['pk']}"
                      for policy in bound["results"]
                      if policy["enabled"]
                      and (
                          not policy["policy_obj"]
                          or policy["policy_obj"]["name"] not in EXPECTED_STAGE_POLICIES
                      )
                  )
                  check(not unexpected, f"{name}: no policy can skip the stage (extra: {unexpected})")
                  if action == "configure":
                      enrollment = [get(f"stages/all/{pk}/") for pk in stage["configuration_stages"]]
                      check(bool(enrollment), f"{name}: has at least one configuration stage")
                      for configuration_stage in enrollment:
                          check(
                              configuration_stage["meta_model_name"] in ALLOWED_CONFIGURATION_STAGES,
                              f"{name}: configuration stage {configuration_stage['name']} enrolls a strong factor",
                          )

              # a passkey login (auth_webauthn_pwl) satisfies both factors and authentik's own
              # policy then skips the validation stage, so the identification stage decides how
              # strict the only remaining check is
              audited = {binding["stage"] for binding in bindings}
              identification = [
                  binding
                  for binding in flow_bindings
                  if binding["stage_obj"]["meta_model_name"] == IDENTIFICATION_MODEL
              ]
              check(bool(identification), f"flow {flow_slug} has an identification stage bound")

              for binding in identification:
                  stage = get(f"stages/identification/{binding['stage']}/")
                  name = stage["name"]
                  passkey_stage = stage["webauthn_stage"]
                  # the challenge takes its user-verification requirement from this stage, so it
                  # has to be one of the stages asserted strict above - any other stage could
                  # accept a passkey without a PIN or biometric as a single factor
                  check(
                      not passkey_stage or passkey_stage in audited,
                      f"{name}: passkey login validates against an audited stage "
                      f"(webauthn_stage={passkey_stage})",
                  )
                  # the linked passwordless flow is a second front door, so it gets walked too:
                  # nothing but the audited validation stage and the login stage that ends it, and
                  # no policy able to skip either. a flow that lost its validation stage would log
                  # anyone in with no factor at all
                  passwordless_flow = stage["passwordless_flow"]
                  if not passwordless_flow:
                      continue
                  passwordless_bindings = [
                      passwordless_binding
                      for passwordless_binding in get(f"flows/bindings/?target={passwordless_flow}")["results"]
                      if passwordless_binding["target"] == passwordless_flow
                  ]
                  check(
                      any(
                          passwordless_binding["stage"] in audited
                          for passwordless_binding in passwordless_bindings
                      ),
                      f"{name}: passwordless flow validates against an audited stage",
                  )
                  for passwordless_binding in passwordless_bindings:
                      stage_obj = passwordless_binding["stage_obj"]
                      check(
                          passwordless_binding["stage"] in audited
                          or stage_obj["meta_model_name"] in PASSWORDLESS_ALLOWED_MODELS,
                          f"{name}: passwordless flow only binds audited stages "
                          f"(unexpected: {stage_obj['name']})",
                      )
                      bound = get(
                          f"policies/bindings/?target={passwordless_binding['policybindingmodel_ptr_id']}"
                      )
                      skippable = sorted(
                          policy["policy_obj"]["name"]
                          if policy["policy_obj"]
                          else f"group/user binding {policy['pk']}"
                          for policy in bound["results"]
                          if policy["enabled"]
                      )
                      check(
                          not skippable,
                          f"{name}: no policy can skip {stage_obj['name']} in the passwordless "
                          f"flow (extra: {skippable})",
                      )

              managed = get("stages/authenticator/validate/?name=default-authentication-mfa-validation")
              count = managed["pagination"]["count"]
              check(count == 1, f"exactly one default-authentication-mfa-validation stage exists (found {count})")

              setup = get("stages/authenticator/webauthn/?name=default-authenticator-webauthn-setup")["results"]
              check(len(setup) == 1, f"exactly one webauthn setup stage exists (found {len(setup)})")
              for stage in setup:
                  check(
                      stage["user_verification"] == "required",
                      f"{stage['name']}: enrollment enforces user verification",
                  )
                  # only a discoverable credential can be a first factor, so relaxing this
                  # silently leaves new keys unable to log in passwordless
                  check(
                      stage["resident_key_requirement"] == "required",
                      f"{stage['name']}: enrollment creates discoverable credentials "
                      f"(resident_key_requirement={stage['resident_key_requirement']})",
                  )

              if failures:
                  print(f"\n{len(failures)} assertion(s) failed - 2FA enforcement has drifted")
                  sys.exit(1)
              print("\n2FA enforcement intact")
          volumeMounts:
            - name: api-token
              mountPath: /api-token
              readOnly: true
          securityContext:
            runAsGroup: 1000
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
