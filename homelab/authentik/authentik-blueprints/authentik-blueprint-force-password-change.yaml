---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-force-password-change
data:
  force-password-change.yaml: |
    version: 1
    metadata:
      name: derwitt-site-force-password-change
    entries:
      # set attributes.require_password_change: true on a user (in the Attributes field when
      # creating them) to force a password change on their next login. the clear-write stage
      # below flips it back to false once the change succeeds, so the flag is self-resetting
      # and only ever fires on the first login after it is set.
      - model: authentik_policies_expression.expressionpolicy
        id: force-password-change-required
        state: present
        identifiers:
          name: derwitt-site-force-password-change-required
        attrs:
          expression: |
            # unlike the email-verification policy this defaults to False when the answer is not
            # yet knowable: a spurious extra verification screen is harmless, but forcing every
            # login through a password change on missing context would lock the whole realm out.
            # re_evaluate_policies on the bindings guarantees pending_user is set by the time it
            # actually matters.
            flow_plan = request.context.get("flow_plan")
            if not flow_plan:
                return False
            user = flow_plan.context.get("pending_user")
            if not user or not user.pk:
                return False
            return bool(user.attributes.get("require_password_change", False))

      # hidden field that resets the flag. placeholder_expression writes a real boolean False
      # rather than the string "false", which would stay truthy and re-trigger the flow forever.
      - model: authentik_stages_prompt.prompt
        id: force-password-change-clear-flag-field
        state: present
        identifiers:
          name: derwitt-site-force-password-change-clear-flag
        attrs:
          field_key: attributes.require_password_change
          label: Password change complete
          type: hidden
          required: false
          order: 0
          placeholder_expression: true
          placeholder: |
            return False

      - model: authentik_stages_prompt.promptstage
        id: force-password-change-clear-stage
        state: present
        identifiers:
          name: derwitt-site-force-password-change-clear
        attrs:
          fields:
            - !KeyOf force-password-change-clear-flag-field

      - model: authentik_stages_user_write.userwritestage
        id: force-password-change-clear-write
        state: present
        identifiers:
          name: derwitt-site-force-password-change-clear-write
        attrs:
          user_creation_mode: never_create

      # bindings into default-authentication-flow. orders 21-24 sit right after the password
      # stage (20) and before the MFA enrollment notice (25): a temporary password is replaced
      # before anything else happens. all four re-evaluate the policy because pending_user only
      # exists once the identification stage (10) has run.
      #   21 default-password-change-prompt  - new password + repeat, with authentik's own validation
      #   22 default-password-change-write    - sets the new password
      #   23 clear-prompt                     - hidden field carrying require_password_change=false
      #   24 clear-write                      - persists the cleared flag
      - model: authentik_flows.flowstagebinding
        id: auth-flow-force-password-change-prompt-binding
        state: present
        identifiers:
          target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          stage: !Find [authentik_stages_prompt.promptstage, [name, default-password-change-prompt]]
          order: 21
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: true
          policy_engine_mode: any
          invalid_response_action: retry
      - model: authentik_flows.flowstagebinding
        id: auth-flow-force-password-change-write-binding
        state: present
        identifiers:
          target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          stage: !Find [authentik_stages_user_write.userwritestage, [name, default-password-change-write]]
          order: 22
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: true
          policy_engine_mode: any
          invalid_response_action: retry
      - model: authentik_flows.flowstagebinding
        id: auth-flow-force-password-change-clear-prompt-binding
        state: present
        identifiers:
          target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          stage: !KeyOf force-password-change-clear-stage
          order: 23
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: true
          policy_engine_mode: any
          invalid_response_action: retry
      - model: authentik_flows.flowstagebinding
        id: auth-flow-force-password-change-clear-write-binding
        state: present
        identifiers:
          target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          stage: !KeyOf force-password-change-clear-write
          order: 24
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: true
          policy_engine_mode: any
          invalid_response_action: retry

      # same four stages into the passwordless flow so a flagged user cannot skip the change by
      # signing in with a passkey. mfa-validation is at 10 and email verification at 40-42 there,
      # so 21-24 keeps the same relative position.
      - model: authentik_flows.flowstagebinding
        id: passwordless-flow-force-password-change-prompt-binding
        state: present
        identifiers:
          target: !Find [authentik_flows.flow, [slug, derwitt-site-passwordless]]
          stage: !Find [authentik_stages_prompt.promptstage, [name, default-password-change-prompt]]
          order: 21
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: true
          policy_engine_mode: any
          invalid_response_action: retry
      - model: authentik_flows.flowstagebinding
        id: passwordless-flow-force-password-change-write-binding
        state: present
        identifiers:
          target: !Find [authentik_flows.flow, [slug, derwitt-site-passwordless]]
          stage: !Find [authentik_stages_user_write.userwritestage, [name, default-password-change-write]]
          order: 22
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: true
          policy_engine_mode: any
          invalid_response_action: retry
      - model: authentik_flows.flowstagebinding
        id: passwordless-flow-force-password-change-clear-prompt-binding
        state: present
        identifiers:
          target: !Find [authentik_flows.flow, [slug, derwitt-site-passwordless]]
          stage: !KeyOf force-password-change-clear-stage
          order: 23
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: true
          policy_engine_mode: any
          invalid_response_action: retry
      - model: authentik_flows.flowstagebinding
        id: passwordless-flow-force-password-change-clear-write-binding
        state: present
        identifiers:
          target: !Find [authentik_flows.flow, [slug, derwitt-site-passwordless]]
          stage: !KeyOf force-password-change-clear-write
          order: 24
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: true
          policy_engine_mode: any
          invalid_response_action: retry

      # gate every binding on the flag. failure_result: true shows the stage on a policy error
      # rather than silently letting a flagged user through without changing their password.
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf auth-flow-force-password-change-prompt-binding
          policy: !KeyOf force-password-change-required
          order: 0
        attrs:
          failure_result: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf auth-flow-force-password-change-write-binding
          policy: !KeyOf force-password-change-required
          order: 0
        attrs:
          failure_result: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf auth-flow-force-password-change-clear-prompt-binding
          policy: !KeyOf force-password-change-required
          order: 0
        attrs:
          failure_result: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf auth-flow-force-password-change-clear-write-binding
          policy: !KeyOf force-password-change-required
          order: 0
        attrs:
          failure_result: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf passwordless-flow-force-password-change-prompt-binding
          policy: !KeyOf force-password-change-required
          order: 0
        attrs:
          failure_result: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf passwordless-flow-force-password-change-write-binding
          policy: !KeyOf force-password-change-required
          order: 0
        attrs:
          failure_result: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf passwordless-flow-force-password-change-clear-prompt-binding
          policy: !KeyOf force-password-change-required
          order: 0
        attrs:
          failure_result: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf passwordless-flow-force-password-change-clear-write-binding
          policy: !KeyOf force-password-change-required
          order: 0
        attrs:
          failure_result: true
