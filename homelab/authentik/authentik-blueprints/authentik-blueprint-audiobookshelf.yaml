---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-audiobookshelf
spec:
  refreshInterval: "1h0m0s"
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-audiobookshelf
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        audiobookshelf.yaml: |
          version: 1
          metadata:
            name: derwitt-site-audiobookshelf
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              state: present
              id: audiobookshelf_provider
              identifiers:
                client_id: audiobookshelf
              attrs:
                name: Audiobookshelf
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
                redirect_uris:
                  - matching_mode: strict
                    url: https://audiobooks.derwitt.site/audiobookshelf/auth/openid/callback
                    redirect_uri_type: authorization
                  - matching_mode: strict
                    url: https://audiobooks.derwitt.site/audiobookshelf/auth/openid/mobile-redirect
                    redirect_uri_type: authorization
                # left unset the list ends up empty and authentik rejects the code flow at /authorize
                grant_types:
                  - authorization_code
                  - refresh_token
                include_claims_in_id_token: true
                sub_mode: hashed_user_id
                client_secret: "{{ .clientSecret }}"
                property_mappings:
                  # audiobookshelf only provisions users whose email the idp reports as verified
                  - !Find [authentik_providers_oauth2.scopemapping, [name, scope-email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [name, audiobookshelf-profile]]
                  - !Find [authentik_providers_oauth2.scopemapping, [name, audiobookshelf-groups]]
                  - !Find [authentik_providers_oauth2.scopemapping, [name, audiobookshelf-permissions]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, "Derwitt Signing Key (ECDSA)"]]
            - model: authentik_core.application
              state: present
              id: audiobookshelf_application
              identifiers:
                slug: audiobookshelf
              attrs:
                name: Audiobookshelf
                provider: !KeyOf audiobookshelf_provider
                meta_launch_url: https://audiobooks.derwitt.site/audiobookshelf
                policy_engine_mode: any
            - model: authentik_policies.policybinding
              state: present
              identifiers:
                target: !KeyOf audiobookshelf_application
                group: !Find [authentik_core.group, [name, "Audiobookshelf Users"]]
              attrs:
                order: 0
            - model: authentik_policies.policybinding
              state: present
              identifiers:
                target: !KeyOf audiobookshelf_application
                group: !Find [authentik_core.group, [name, "Audiobookshelf Admins"]]
              attrs:
                order: 1
  data:
    - remoteRef:
        conversionStrategy: Default
        key: authentik/oauth2-clients/audiobookshelf
        property: client-secret
      secretKey: clientSecret
