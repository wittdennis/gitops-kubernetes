---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgres
spec:
  instances: 3
  logLevel: warning
  enablePDB: true
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgres
    major: 18
  managed:
    roles:
      - name: authentik
        superuser: false
        createdb: false
        login: true
  postgresql:
    shared_preload_libraries:
      - pg_partman_bgw
    parameters:
      max_connections: "200"
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backup-store
  resources:
    requests:
      cpu: 250m
      ephemeral-storage: 50Mi
      memory: 1Gi
    limits:
      memory: 2Gi
  storage:
    size: 10Gi
    storageClass: proxmox-data
  walStorage:
    size: 20Gi
    storageClass: proxmox-data
