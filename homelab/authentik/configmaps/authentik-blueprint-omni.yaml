---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-omni
data:
  omni.yaml: |
    version: 1
    metadata:
      name: derwitt-site-omni
    entries:
      # Omni decommissioned - entries marked absent to remove them from Authentik.
      # Deletion order is reversed from creation (dependents before their dependencies).
      - model: authentik_policies.policybinding
        state: absent
        identifiers:
          target: !Find [authentik_core.application, [slug, omni]]
          group: !Find [authentik_core.group, [name, "SuperUsers"]]
      - model: authentik_core.application
        state: absent
        identifiers:
          slug: omni
      - model: authentik_providers_saml.samlprovider
        state: absent
        identifiers:
          name: Omni
      - model: authentik_providers_saml.samlpropertymapping
        state: absent
        identifiers:
          name: "Omni email"
