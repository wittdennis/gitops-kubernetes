---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-netbox
data:
  netbox.yaml: |
    version: 1
    metadata:
      name: derwitt-site-netbox
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: netbox_provider
        identifiers:
          client_id: netbox
        attrs:
          name: Netbox
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          allowed_redirect_uris:
            - matching_mode: strict
              url: https://netbox.derwitt.site/oauth/complete/oidc/
              redirect_uri_type: authorization
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "Derwitt Signing Key (RSA)"]]
      - model: authentik_core.application
        state: present
        id: netbox_application
        identifiers:
          slug: netbox
        attrs:
          name: Netbox
          protocol_provider: !KeyOf netbox_provider
          meta_launch_url: https://netbox.derwitt.site
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf netbox_application
          group: !Find [authentik_core.group, [name, "SuperUsers"]]
        attrs:
          order: 0
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf netbox_application
          group: !Find [authentik_core.group, [name, "Netbox Admins"]]
        attrs:
          order: 1
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf netbox_application
          group: !Find [authentik_core.group, [name, "Netbox Users"]]
        attrs:
          order: 2
