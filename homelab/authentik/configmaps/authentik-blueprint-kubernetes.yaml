---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-kubernetes
data:
  kubernetes.yaml: |
    version: 1
    metadata:
      name: derwitt-site-kubernetes
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: kubernetes_provider
        identifiers:
          client_id: kubernetes
        attrs:
          name: Kubernetes
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          allowed_redirect_uris:
            - matching_mode: strict
              url: http://localhost:8000
              redirect_uri_type: authorization
            - matching_mode: strict
              url: http://localhost:18000
              redirect_uri_type: authorization
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [name, email-unsecure-email-verified-true]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "Derwitt Signing Key (ECDSA)"]]
      - model: authentik_core.application
        state: present
        id: kubernetes_application
        identifiers:
          slug: kubernetes
        attrs:
          name: Kubernetes
          protocol_provider: !KeyOf kubernetes_provider
          meta_launch_url: "https://k8s.home-assistant.derwitt.site:6443/api"
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf kubernetes_application
          group: !Find [authentik_core.group, [name, "k8s-admins"]]
        attrs:
          order: 0
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf kubernetes_application
          group: !Find [authentik_core.group, [name, "k8s-readers"]]
        attrs:
          order: 1
