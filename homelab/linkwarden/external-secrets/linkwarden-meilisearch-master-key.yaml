---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkwarden-meilisearch-master-key
spec:
  refreshInterval: "1h0m0s"
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  target:
    name: linkwarden-meilisearch-master-key
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - remoteRef:
        conversionStrategy: Default
        key: /linkwarden/meilisearch
        property: master-key
      secretKey: master-key
    - remoteRef:
        conversionStrategy: Default
        key: /linkwarden/meilisearch
        property: master-key
      secretKey: MEILI_MASTER_KEY
