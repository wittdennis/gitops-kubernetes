---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: litellm-postgres
spec:
  instances: 1
  logLevel: warning
  enablePDB: false
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: false
  affinity:
    nodeSelector:
      derwitt.site/ai: "true"
  bootstrap:
    initdb:
      database: litellm
      owner: litellm
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgres
    major: 18
  managed:
    roles:
      - name: litellm
        superuser: false
        createdb: false
        login: true
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backup-store
  resources:
    requests:
      cpu: 100m
      ephemeral-storage: 50Mi
      memory: 128Mi
  storage:
    size: 10Gi
    storageClass: proxmox-data
  walStorage:
    size: 5Gi
    storageClass: proxmox-data
