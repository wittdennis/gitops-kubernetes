---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-secrets
spec:
  refreshInterval: "1h0m0s"
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  target:
    name: hermes-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - remoteRef:
        conversionStrategy: Default
        key: /ai-platform/hermes
        property: litellm-key
      secretKey: litellm-key
    # Hermes refuses keys shorter than 16 characters.
    - remoteRef:
        conversionStrategy: Default
        key: /ai-platform/hermes
        property: api-server-key
      secretKey: api-server-key
    - remoteRef:
        conversionStrategy: Default
        key: /ai-platform/hermes
        property: claude-oauth-token
      secretKey: claude-oauth-token
    - remoteRef:
        conversionStrategy: Default
        key: /ai-platform/hermes
        property: matrix-access-token
      secretKey: matrix-access-token
    - remoteRef:
        conversionStrategy: Default
        key: /ai-platform/hermes
        property: matrix-recovery-key
      secretKey: matrix-recovery-key
