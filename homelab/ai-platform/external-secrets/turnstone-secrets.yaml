---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: turnstone-secrets
spec:
  refreshInterval: "1h0m0s"
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  target:
    name: turnstone-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - remoteRef:
        conversionStrategy: Default
        key: authentik/oauth2-clients/turnstone
        property: client-secret
      secretKey: oidc-client-secret
    - remoteRef:
        conversionStrategy: Default
        key: /ai-platform/turnstone
        property: litellm-key
      secretKey: litellm-key
    - remoteRef:
        conversionStrategy: Default
        key: /ai-platform/turnstone
        property: jwt-secret
      secretKey: jwt-secret
    # Rotating this makes every stored MCP OAuth token unreadable.
    - remoteRef:
        conversionStrategy: Default
        key: /ai-platform/turnstone
        property: mcp-token-encryption-key
      secretKey: mcp-token-encryption-key
