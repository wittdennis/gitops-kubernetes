---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ollama-otter-tls
spec:
  secretName: ollama-otter-tls
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - digital signature
    - key encipherment
    - server auth
  dnsNames:
    - "ollama.otter.derwitt.site"
  issuerRef:
    name: derwitt-site-cluster-issuer
    kind: ClusterIssuer
