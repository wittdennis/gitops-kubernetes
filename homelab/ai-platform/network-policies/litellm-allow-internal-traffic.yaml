---
# Selecting the litellm pods for both directions puts them into Cilium's
# default deny. The remaining litellm-* policies are the explicit allows.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm-allow-internal-traffic
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/instance: litellm
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: litellm
            app.kubernetes.io/instance: litellm
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: litellm
            app.kubernetes.io/instance: litellm
