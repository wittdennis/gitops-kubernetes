---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-allow-litellm-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
      app.kubernetes.io/instance: hermes-agent
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: litellm
            app.kubernetes.io/instance: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
