---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm-allow-penpot-mcp-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/instance: litellm
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: penpot
            app.kubernetes.io/name: penpot-mcp
      toPorts:
        - ports:
            - port: "4401"
              protocol: TCP
