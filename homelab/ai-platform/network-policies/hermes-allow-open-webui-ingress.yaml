---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-allow-open-webui-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
      app.kubernetes.io/instance: hermes-agent
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: open-webui
            app.kubernetes.io/instance: open-webui
      toPorts:
        - ports:
            - port: "8642"
              protocol: TCP
