---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJobTemplate
metadata:
  name: github-default
spec:
  image: ghcr.io/renovatebot/renovate:44.182.1 # renovate
  parallelism: 5
  resources:
    requests:
      memory: 512Mi
  provider:
    name: github
  webhook:
    enabled: true
    baseUrl: https://api.renovate.derwitt.dev
    authentication:
      enabled: true
      secretRef:
        name: renovate-webhook-token
        key: token
    sync:
      enabled: false
  extraEnv:
    - name: LOG_LEVEL
      value: debug
    - name: RENOVATE_ONBOARDING_CONFIG
      value: |
        {
            "$schema": "https://docs.renovatebot.com/renovate-schema.json",
            "extends": ["local>wittdennis/renovate-config"]
        }
  githubAppReference:
    appIdSecretKey: client-id
    installationIdSecretKey: installation-id
    pemSecretKey: private-key.pem
    secretName: github-app-config
  secretRef: renovate-env
