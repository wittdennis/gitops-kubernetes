---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-env-temp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  target:
    name: renovate-env
    creationPolicy: Owner
    deletionPolicy: Delete
  dataFrom:
    - extract:
        key: renovate-operator/renovate/temp-env
        property: json
