---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: renovate-operator-api-tailnet
spec:
  hostnames:
    - api.renovate.tailnet.derwitt.site
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab-services-tailnet-gateway
      namespace: headscale-operator
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: renovate-operator-renovate-operator
          port: 8082
          weight: 100
      matches:
        - path:
            type: PathPrefix
            value: /
