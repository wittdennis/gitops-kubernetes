---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: forgejo-homelab
spec:
  schedule: "15 6-19/2 * * 1-5"
  image: ghcr.io/renovatebot/renovate:43.249.0 # renovate
  parallelism: 5
  provider:
    name: forgejo
    endpoint: https://git.derwitt.site
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: renovate-webhook-token
        key: token
    forgejo:
      sync:
        enabled: true
        webhookURL: https://git.derwitt.site/webhook/v1/forgejo
        topic: renovate
        tokenSecretRef:
          name: renovate-webhook-token
          key: forgejo-api-token
        authTokenSecretRef:
          name: renovate-webhook-token
          key: token
  extraEnv:
    - name: LOG_LEVEL
      value: debug
    - name: RENOVATE_ONBOARDING_CONFIG
      value: |
        {
          "$schema": "https://docs.renovatebot.com/renovate-schema.json",
          "extends": ["local>renovate/config#main"],
        }
  extraEnvFrom:
    - secretRef:
        name: renovate-env
  discoveryFilters:
    - "homelab/**"
