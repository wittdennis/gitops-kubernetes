---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: forgejo-containers
spec:
  schedule: "15 6-19/2 * * 1-5"
  image: ghcr.io/renovatebot/renovate:44.62.0 # renovate
  parallelism: 5
  provider:
    name: forgejo
    endpoint: https://git.derwitt.site
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: renovate-webhook-token
        key: token
    sync:
      enabled: true
  extraEnv:
    - name: LOG_LEVEL
      value: debug
    - name: RENOVATE_ONBOARDING_CONFIG
      value: |
        {
          "$schema": "https://docs.renovatebot.com/renovate-schema.json",
          "extends": ["local>renovate/config#main"],
        }
  discoveryFilters:
    - "containers/**"
  secretRef: renovate-env
