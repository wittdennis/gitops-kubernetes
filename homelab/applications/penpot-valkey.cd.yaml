---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-penpot-valkey
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - ServerSideApply=true
  destination:
    name: homelab
    namespace: penpot
  source:
    repoURL: oci://ghcr.io/valkey-io/valkey-helm/valkey
    path: "."
    targetRevision: 1.0.0
    helm:
      releaseName: penpot-valkey
      valuesObject:
        image:
          registry: "docker.io"
          repository: valkey/valkey
          pullPolicy: IfNotPresent
          tag: "9.2.1" # renovate: datasource=docker depName=docker.io/valkey/valkey versioning=docker
        auth:
          enabled: true
          usersExistingSecret: penpot-valkey-credentials
          aclUsers:
            default:
              permissions: "~* &* +@all"
              passwordKey: default-password
            penpot:
              permissions: "~* &* +@all"
              passwordKey: "penpot-password"
        # pub/sub message bus and rate limiting only, nothing durable
        persistence:
          enabled: false
        resources:
          requests:
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          privileged: false
          capabilities:
            drop:
              - ALL
        metrics:
          enabled: true
          exporter:
            extraEnv:
              - name: REDIS_USER
                value: "default"
            resources:
              requests:
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              privileged: false
              capabilities:
                drop:
                  - ALL
          serviceMonitor:
            enabled: true
          podMonitor:
            enabled: true
          prometheusRule:
            enabled: true
            rules:
              - alert: PenpotValkeyDown
                annotations:
                  summary: Valkey instance {{ "{{ $labels.instance }}" }} down
                  description: Valkey instance {{ "{{ $labels.instance }}" }} is down.
                expr: |
                  redis_up{service="{{ include "valkey.fullname" . }}-metrics"} == 0
                for: 2m
                labels:
                  severity: warning
              - alert: PenpotValkeyMemoryHigh
                annotations:
                  summary: Valkey instance {{ "{{ $labels.instance }}" }} is using too much memory
                  description: |
                    Valkey instance {{ "{{ $labels.instance }}" }} is using {{ "{{ $value }}" }}% of its available memory.
                expr: |
                  redis_memory_used_bytes{service="{{ include "valkey.fullname" . }}-metrics"} * 100
                  /
                  redis_memory_max_bytes{service="{{ include "valkey.fullname" . }}-metrics"}
                  > 90 <= 100
                for: 2m
                labels:
                  severity: warning
              - alert: PenpotValkeyKeyEviction
                annotations:
                  summary: Valkey instance {{ "{{ $labels.instance }}" }} has evicted keys
                  description: |
                    Valkey instance {{ "{{ $labels.instance }}" }} has evicted {{ "{{ $value }}" }} keys in the last 5 minutes.
                expr: |
                  increase(redis_evicted_keys_total{service="{{ include "valkey.fullname" . }}-metrics"}[5m]) > 0
                for: 1s
                labels:
                  severity: warning
