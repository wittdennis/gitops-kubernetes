---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-loki-resources
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/client-side-apply-migration-manager: argocd-controller
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - ServerSideApply=true
  destination:
    name: homelab
    namespace: loki
  source:
    repoURL: https://git.derwitt.site/homelab/yggdrasil
    targetRevision: HEAD
    path: "homelab/loki"
    directory:
      recurse: true
