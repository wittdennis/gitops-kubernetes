---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-memos
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/client-side-apply-migration-manager: argocd-controller
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - ServerSideApply=true
  destination:
    name: homelab
    namespace: memos
  source:
    repoURL: oci://ghcr.io/wittdennis/helm-charts/memos
    path: "."
    targetRevision: 3.0.0
    helm:
      valuesObject:
        memos:
          instanceUrl: https://notes.derwitt.site
          databaseDriver: postgres
          existingDsnSecret:
            name: memos-postgres-app
            key: fqdn-uri
        replicaCount: 2
        resources:
          requests:
            memory: 64Mi
        persistence:
          enabled: false
        route:
          enabled: true
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: derwitt-site-gateway
              namespace: traefik
          hostnames:
            - notes.derwitt.site
