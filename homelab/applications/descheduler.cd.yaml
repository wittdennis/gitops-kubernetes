---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-descheduler
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: homelab
    namespace: kube-system
  source:
    repoURL: https://kubernetes-sigs.github.io/descheduler
    targetRevision: 0.37.0
    chart: descheduler
    helm:
      releaseName: descheduler
      values: |

        kind: Deployment
        replicas: 3
        resources:
          requests:
            memory: 128Mi
        leaderElection:
          enabled: true
        cmdOptions:
          v: 3
          logging-format: json
        service:
          enabled: true
        serviceMonitor:
         enabled: true
        deschedulingInterval: 15m
        deschedulerPolicy:
          # control-plane nodes are tainted, so their free capacity can never receive evicted pods
          nodeSelector: "!node-role.kubernetes.io/control-plane"
          profiles:
            - name: default
              pluginConfig:
                - name: DefaultEvictor
                  args:
                    nodeFit: true
                    minReplicas: 2
                    podProtections:
                      defaultDisabled:
                        - PodsWithLocalStorage
                - name: RemoveDuplicates
                - name: RemovePodsHavingTooManyRestarts
                  args:
                    podRestartThreshold: 100
                    includingInitContainers: true
                - name: RemoveFailedPods
                  args:
                    minPodLifetimeSeconds: 3600
                    excludeOwnerKinds:
                      - Job
                - name: RemovePodsViolatingNodeAffinity
                  args:
                    nodeAffinityType:
                      - requiredDuringSchedulingIgnoredDuringExecution
                - name: RemovePodsViolatingNodeTaints
                - name: RemovePodsViolatingInterPodAntiAffinity
                - name: RemovePodsViolatingTopologySpreadConstraint
                # Utilization is measured on requests, matching what the scheduler places by.
                # cpu and pods thresholds sit above any realistic value so memory alone decides.
                - name: LowNodeUtilization
                  args:
                    thresholds:
                      cpu: 70
                      memory: 65
                      pods: 70
                    targetThresholds:
                      cpu: 90
                      memory: 85
                      pods: 90
              plugins:
                balance:
                  enabled:
                    - RemoveDuplicates
                    - RemovePodsViolatingTopologySpreadConstraint
                    - LowNodeUtilization
                deschedule:
                  enabled:
                    - RemovePodsHavingTooManyRestarts
                    - RemoveFailedPods
                    - RemovePodsViolatingNodeTaints
                    - RemovePodsViolatingNodeAffinity
                    - RemovePodsViolatingInterPodAntiAffinity
