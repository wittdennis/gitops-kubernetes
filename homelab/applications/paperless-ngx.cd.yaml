---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-paperless-ngx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  # the backup workflow scales this to 0 for the duration of the backup; without this, a
  # sync landing mid-backup reasserts replicas: 1 and races the backup pod's PVC attach
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: homelab-paperless-ngx
      namespace: paperless-ngx
      jsonPointers:
        - /spec/replicas
  destination:
    name: homelab
    namespace: paperless-ngx
  source:
    repoURL: oci://ghcr.io/wittdennis/helm-charts/paperless-ngx
    path: "."
    targetRevision: 2.1.2
    helm:
      valuesObject:
        ocr:
          language: deu

        redis:
          connectionSecret:
            name: valkey-connection-url
            key: url

        database:
          engine: postgresql
          host: paperless-ngx-postgres-rw.paperless-ngx.svc.cluster.local
          userSecret:
            name: paperless-ngx-postgres-app
            key: user
          passwordSecret:
            name: paperless-ngx-postgres-app
            key: password

        hosting:
          secretKey:
            create: false
            name: paperless-ngx-secret-key
          # traefik runs as a daemonset, so match the whole pod network by prefix.
          # matching is prefix based, CIDR notation never matches
          trustedProxies:
            - "10.244."

        auth:
          sso:
            providersSecret:
              name: paperless-ngx-sso-settings
              key: providers-config
            autoSignup: true
            syncGroups: true
            disableRegularLogin: true

        tweaks:
          apps: allauth.socialaccount.providers.openid_connect
          timezone: Europe/Berlin

        documentConsumption:
          dateOrder: DMY

        ai:
          enabled: true
          backend: openai-like
          endpoint: http://litellm.ai-platform.svc.cluster.local:4000/v1
          model: b580:llama3.1:8b
          apiKeySecret:
            name: paperless-ngx-litellm-key
            key: api-token
          contextSize: 8192
          outputLanguage: de-de
          embedding:
            backend: openai-like
            model: b580:nomic-embed-text


        email:
          sending:
            host: smtp.protonmail.ch
            user: noreply@derwitt.site
            port: 587
            useTls: true
            passwordSecret:
              name: email-settings
              key: password

        deploymentStrategy:
          type: Recreate

        route:
          enabled: true
          hostnames:
            - documents.derwitt.site
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: derwitt-site-gateway
              namespace: traefik

        persistence:
          data:
            storageClass: proxmox-data
            size: 1Gi
          media:
            storageClass: proxmox-data
            size: 100Gi
