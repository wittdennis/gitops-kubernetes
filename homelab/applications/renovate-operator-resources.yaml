---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-renovate-operator-resources
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: homelab
    namespace: renovate-operator
  source:
    repoURL: https://github.com/wittdennis/k8s-platform
    targetRevision: HEAD
    path: "homelab/renovate-operator"
    directory:
      recurse: true
