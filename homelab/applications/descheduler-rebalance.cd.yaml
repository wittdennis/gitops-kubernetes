---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-descheduler-rebalance
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: homelab
    namespace: kube-system
  source:
    repoURL: https://kubernetes-sigs.github.io/descheduler
    targetRevision: 0.37.0
    chart: descheduler
    helm:
      releaseName: descheduler-rebalance
      values: |

        # Nightly window in which single-replica workloads may be restarted to
        # even out node usage; the continuous descheduler protects them via minReplicas.
        kind: CronJob
        schedule: "0 4 * * *"
        timeZone: Europe/Berlin
        successfulJobsHistoryLimit: 1
        failedJobsHistoryLimit: 1
        cmdOptions:
          v: 3
          logging-format: json
        deschedulerPolicy:
          # control-plane nodes are tainted, so their free capacity can never receive evicted pods
          nodeSelector: "!node-role.kubernetes.io/control-plane"
          profiles:
            - name: rebalance
              pluginConfig:
                - name: DefaultEvictor
                  args:
                    nodeFit: true
                    podProtections:
                      defaultDisabled:
                        - PodsWithLocalStorage
                # Utilization is measured on requests, matching what the scheduler places by.
                # cpu and pods thresholds sit above any realistic value so memory alone decides.
                - name: LowNodeUtilization
                  args:
                    thresholds:
                      cpu: 70
                      memory: 65
                      pods: 70
                    targetThresholds:
                      cpu: 90
                      memory: 85
                      pods: 90
              plugins:
                balance:
                  enabled:
                    - LowNodeUtilization
