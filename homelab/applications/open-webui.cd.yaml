---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-open-webui
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: homelab
    namespace: ai-platform
  source:
    repoURL: https://helm.openwebui.com
    chart: open-webui
    targetRevision: 16.0.0
    helm:
      releaseName: open-webui
      valuesObject:
        # Slim skips only the pre-baked model weights (embedding, whisper): that
        # cache is root-owned and unreadable as UID 1000, and loading it needs
        # ~2Gi. Python deps are identical, so local models still work — at the
        # cost of runtime downloads into the PVC and that memory floor.
        image:
          useSlim: true

        nodeSelector:
          derwitt.site/ai: "true"

        ollama:
          enabled: false
        pipelines:
          enabled: false

        # Single replica: in-memory websocket manager, no bundled Redis.
        websocket:
          manager: ""
          redis:
            enabled: false

        openaiBaseApiUrl: "http://litellm.ai-platform.svc.cluster.local:4000/v1"
        openaiApiKeyExistingSecret: open-webui-secrets
        openaiApiKeyExistingSecretKey: OPENAI_API_KEY

        persistence:
          enabled: true
          storageClass: proxmox-data
          size: 5Gi
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

        ingress:
          enabled: false

        # No-op the seed init: it copies root-owned baked content that fails to
        # read as UID 1000. App data initializes fresh in the writable PVC.
        copyAppData:
          command: ["sh", "-c", "true"]

        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL

        extraEnvVars:
          - name: WEBUI_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: open-webui-secrets
                key: WEBUI_SECRET_KEY
          - name: WEBUI_URL
            value: https://chat.derwitt.site
          - name: ENABLE_OAUTH_SIGNUP
            value: "true"
          - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
            value: "true"
          - name: OAUTH_PROVIDER_NAME
            value: Authentik
          - name: OPENID_PROVIDER_URL
            value: https://auth.derwitt.site/application/o/open-webui/.well-known/openid-configuration
          - name: OAUTH_SCOPES
            value: "openid email profile"
          - name: OAUTH_CLIENT_ID
            value: open-webui
          - name: OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: open-webui-secrets
                key: OAUTH_CLIENT_SECRET

          # RAG. Embeddings come from LiteLLM (b580:nomic-embed-text) —
          # RAG_OPENAI_API_BASE_URL/KEY default to the OpenAI values above, so the
          # endpoint is not repeated here. Changing the embedding model
          # invalidates every stored vector; re-ingest if it ever changes.
          - name: RAG_EMBEDDING_ENGINE
            value: openai
          - name: RAG_EMBEDDING_MODEL
            value: b580:nomic-embed-text
          - name: ENABLE_RAG_HYBRID_SEARCH
            value: "true"
          - name: RAG_HYBRID_BM25_WEIGHT
            value: "0.6"
          # No reranker configured: without one the retrieved chunks are ordered
          # by cosine similarity against the same embeddings, which needs no
          # local model (the slim image has no baked weights).
          - name: RAG_TOP_K
            value: "5"
          - name: CHUNK_SIZE
            value: "1500"
          - name: CHUNK_OVERLAP
            value: "200"
