---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-cluster-scoped-resources
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - ServerSideApply=true
  destination:
    name: homelab
  source:
    repoURL: https://git.derwitt.site/homelab/yggdrasil
    targetRevision: HEAD
    path: "homelab/cluster-scoped"
    directory:
      recurse: true
