---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-netbox
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: homelab
    namespace: netbox
  source:
    repoURL: oci://ghcr.io/netbox-community/netbox-chart/netbox
    path: "."
    targetRevision: 8.1.4
    helm:
      releaseName: netbox
      valuesObject:
        replicaCount: 3
        image:
          registry: ghcr.io
          repository: wittdennis/netbox
          tag: 1.0.2 # renovate: datasource=docker depName=ghcr.io/wittdennis/netbox versioning=docker
        plugins:
          - netbox_prometheus_sd
          - netbox_reorder_rack
        superuser:
          existingSecret: netbox-superuser-credentials
        csrf:
          cookieName: netbox_derwitt_site_csrf
        email:
          server: smtp.protonmail.ch
          username: netbox@derwitt.site
          existingSecretName: netbox-email-credentials
          existingSecretKey: email-password
          useTLS: true
          port: 587
          from: "Netbox <netbox@derwitt.site>"
        remoteAuth:
          enabled: true
          autoCreateUser: true
          autoCreateGroups: true
          groupSyncEnabled: true
          backends:
            - social_core.backends.open_id_connect.OpenIdConnectAuth
          superuserGroups:
            - SuperUsers
            - Netbox Admins
          staffGroups:
            - Netbox Users
        livenessProbe:
          enabled: true
        extraConfig:
          - values:
              DISK_BASE_UNIT: 1024
              RAM_BASE_UNIT: 1024
              DATA_UPLOAD_MAX_MEMORY_SIZE: 26214400
              SOCIAL_AUTH_OIDC_OIDC_ENDPOINT: https://auth.derwitt.site/application/o/netbox/
              SOCIAL_AUTH_OIDC_KEY: netbox
              SOCIAL_AUTH_OIDC_SCOPE: [openid, profile, email]
              LOGOUT_REDIRECT_URL: https://auth.derwitt.site/application/o/netbox/end-session/
              SOCIAL_AUTH_PIPELINE: [
                ###################
                # Default pipelines
                ###################

                # Get the information we can about the user and return it in a simple
                # format to create the user instance later. In some cases the details are
                # already part of the auth response from the provider, but sometimes this
                # could hit a provider API.
                'social_core.pipeline.social_auth.social_details',

                # Get the social uid from whichever service we're authing thru. The uid is
                # the unique identifier of the given user in the provider.
                'social_core.pipeline.social_auth.social_uid',

                # Verifies that the current auth process is valid within the current
                # project, this is where emails and domains whitelists are applied (if
                # defined).
                'social_core.pipeline.social_auth.auth_allowed',

                # Checks if the current social-account is already associated in the site.
                'social_core.pipeline.social_auth.social_user',

                # Make up a username for this person, appends a random string at the end if
                # there's any collision.
                'social_core.pipeline.user.get_username',

                # Send a validation email to the user to verify its email address.
                # Disabled by default.
                # 'social_core.pipeline.mail.mail_validation',

                # Associates the current social details with another user account with
                # a similar email address. Disabled by default.
                # 'social_core.pipeline.social_auth.associate_by_email',

                # Create a user account if we haven't found one yet.
                'social_core.pipeline.user.create_user',

                # Create the record that associates the social account with the user.
                'social_core.pipeline.social_auth.associate_user',

                # Populate the extra_data field in the social record with the values
                # specified by settings (and the default ones like access_token, etc).
                'social_core.pipeline.social_auth.load_extra_data',

                # Update the user record with any changed info from the auth service.
                'social_core.pipeline.user.user_details',


                ###################
                # Custom pipelines
                ###################
                # Set authentik Groups
                'netbox.authentik_auth_pipeline.add_groups',
                'netbox.authentik_auth_pipeline.remove_groups',
                # Set Roles
                'netbox.authentik_auth_pipeline.set_roles'
              ]
          - secret:
              secretName: netbox-oidc-credentials
          - secret:
              secretName: netbox-api-token-peppers
        extraVolumes:
          - name: authentik-auth-pipeline
            configMap:
              name: authentik-auth-pipeline
        extraVolumeMounts:
          - name: authentik-auth-pipeline
            mountPath: /opt/netbox/netbox/netbox/authentik_auth_pipeline.py
            subPath: authentik_auth_pipeline.py
            readOnly: true
        existingSecret: netbox-passwords-seed
        persistence:
          enabled: false
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: netbox
                    app.kubernetes.io/name: netbox
                    app.kubernetes.io/component: netbox
                topologyKey: kubernetes.io/hostname
        httpRoute:
          enabled: true
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: derwitt-site-gateway
              namespace: traefik
          hostnames:
            - netbox.derwitt.site
          rules:
            - timeouts:
                request: 120s
                backendRequest: 120s
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
          granian:
            enabled: true
            serviceMonitor:
              enabled: true
        postgresql:
          enabled: false
        externalDatabase:
          host: "netbox-postgres-rw.netbox.svc.cluster.local"
          port: 5432
          database: netbox
          username: netbox
          existingSecretName: netbox-postgres-app
          existingSecretKey: password
        valkey:
          enabled: false
        tasksDatabase:
          host: "netbox-valkey.netbox.svc.cluster.local"
          port: 6379
          username: "tasks"
          existingSecretName: netbox-valkey-credentials
          existingSecretKey: tasks-password
        cachingDatabase:
          host: "netbox-valkey.netbox.svc.cluster.local"
          port: 6379
          username: "cache"
          existingSecretName: netbox-valkey-credentials
          existingSecretKey: cache-password
        worker:
          enabled: true
