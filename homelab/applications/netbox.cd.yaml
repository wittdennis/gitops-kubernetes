---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-netbox
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: homelab
    namespace: netbox
  source:
    repoURL: oci://ghcr.io/netbox-community/netbox-chart/netbox
    path: "."
    targetRevision: 8.3.42
    helm:
      releaseName: netbox
      valuesObject:
        replicaCount: 3
        image:
          registry: git.derwitt.site
          repository: containers/netbox
          tag: 1.0.17 # renovate: datasource=docker depName=git.derwitt.site/containers/netbox versioning=docker
        plugins:
          - netbox_prometheus_sd
          - netbox_reorder_rack
        superuser:
          existingSecret: netbox-superuser-credentials
        csrf:
          cookieName: netbox_derwitt_site_csrf
        email:
          server: smtp.protonmail.ch
          username: netbox@derwitt.site
          existingSecretName: netbox-email-credentials
          existingSecretKey: email-password
          useTLS: true
          port: 587
          from: "Netbox <netbox@derwitt.site>"
        remoteAuth:
          enabled: true
          autoCreateUser: true
          autoCreateGroups: true
          groupSyncEnabled: true
          backends:
            - social_core.backends.open_id_connect.OpenIdConnectAuth
          superuserGroups:
            - SuperUsers
            - Netbox Admins
          staffGroups:
            - Netbox Users
        livenessProbe:
          enabled: true
        extraConfig:
          - values:
              DISK_BASE_UNIT: 1024
              RAM_BASE_UNIT: 1024
              DATA_UPLOAD_MAX_MEMORY_SIZE: 26214400
              SOCIAL_AUTH_OIDC_OIDC_ENDPOINT: https://auth.derwitt.site/application/o/netbox/
              SOCIAL_AUTH_OIDC_KEY: netbox
              SOCIAL_AUTH_OIDC_SCOPE: [ openid, profile, email ]
              LOGOUT_REDIRECT_URL: https://auth.derwitt.site/application/o/netbox/end-session/
              SOCIAL_AUTH_PIPELINE:
                [
                  "social_core.pipeline.social_auth.social_details",
                  "social_core.pipeline.social_auth.social_uid",
                  "social_core.pipeline.social_auth.auth_allowed",
                  "social_core.pipeline.social_auth.social_user",
                  "social_core.pipeline.user.get_username",
                  "social_core.pipeline.user.create_user",
                  "social_core.pipeline.social_auth.associate_user",
                  "social_core.pipeline.social_auth.load_extra_data",
                  "social_core.pipeline.user.user_details",

                  # Custom Pipeline
                  "netbox.authentik_auth_pipeline.add_groups",
                  "netbox.authentik_auth_pipeline.remove_groups",
                  "netbox.authentik_auth_pipeline.set_roles",
                ]
          - secret:
              secretName: netbox-oidc-credentials
          - secret:
              secretName: netbox-api-token-peppers
        extraVolumes:
          - name: authentik-auth-pipeline
            configMap:
              name: authentik-auth-pipeline
        extraVolumeMounts:
          - name: authentik-auth-pipeline
            mountPath: /opt/netbox/netbox/netbox/authentik_auth_pipeline.py
            subPath: authentik_auth_pipeline.py
            readOnly: true
        existingSecret: netbox-passwords-seed
        persistence:
          enabled: false
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: netbox
                    app.kubernetes.io/name: netbox
                    app.kubernetes.io/component: netbox
                topologyKey: kubernetes.io/hostname
        httpRoute:
          enabled: true
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: derwitt-site-gateway
              namespace: traefik
          hostnames:
            - netbox.derwitt.site
          rules:
            - timeouts:
                request: 120s
                backendRequest: 120s
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
          granian:
            enabled: true
            serviceMonitor:
              enabled: false
        postgresql:
          enabled: false
        externalDatabase:
          host: "netbox-postgres-rw.netbox.svc.cluster.local"
          port: 5432
          database: netbox
          username: netbox
          existingSecretName: netbox-postgres-app
          existingSecretKey: password
        valkey:
          enabled: false
        tasksDatabase:
          host: "netbox-valkey.netbox.svc.cluster.local"
          port: 6379
          username: "tasks"
          existingSecretName: netbox-valkey-credentials
          existingSecretKey: tasks-password
        cachingDatabase:
          host: "netbox-valkey.netbox.svc.cluster.local"
          port: 6379
          username: "cache"
          existingSecretName: netbox-valkey-credentials
          existingSecretKey: cache-password
        worker:
          enabled: true
