---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-atlantis
  namespace: argocd
spec:
  project: k8s-platform
  destination:
    name: homelab
    namespace: atlantis
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - ServerSideApply=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: atlantis
      namespace: atlantis
      jsonPointers:
        - /spec/replicas
  source:
    repoURL: https://runatlantis.github.io/helm-charts
    chart: atlantis
    targetRevision: 7.3.1
    helm:
      releaseName: atlantis
      values: |

        image:
          repository: git.derwitt.site/containers/atlantis
          tag: 1.1.122 # renovate: datasource=docker depName=git.derwitt.site/containers/atlantis versioning=docker
        orgAllowlist: git.derwitt.site/homelab/terraform
        logLevel: "warn"
        gitea: {}
        environment:
          ATLANTIS_GITEA_USER: atlantis-bot
          ATLANTIS_GITEA_BASE_URL: https://git.derwitt.site
          ATLANTIS_WRITE_GIT_CREDS: "true"
          ATLANTIS_EMOJI_REACTION: eyes
          ATLANTIS_AUTODISCOVER_MODE: disabled
          ATLANTIS_DISABLE_AUTOPLAN: "true"
          ATLANTIS_SILENCE_ALLOWLIST_ERRORS: "true"
          ATLANTIS_SILENCE_FORK_PR_ERRORS: "true"
          ATLANTIS_SILENCE_NO_PROJECTS: "true"
          ATLANTIS_SILENCE_VCS_STATUS_NO_PLANS: "true"
          ATLANTIS_SILENCE_VCS_STATUS_NO_PROJECTS: "true"
          ARM_USE_OIDC: "true"
          ARM_OIDC_TOKEN_FILE_PATH: /var/run/secrets/azure/tokens/azure-identity-token
          ARM_CLIENT_ID: 05d9b68b-e6ce-4653-892e-95ed50f6ec48
          ARM_TENANT_ID: 6ddad1f1-1d3f-43bf-ad7a-445edf40fd73
          ARM_SUBSCRIPTION_ID: 0bec3e6b-1e0f-4f16-adf3-ae7405bbfb55
        environmentSecrets:
          - name: ATLANTIS_GITEA_TOKEN
            secretKeyRef:
              name: atlantis-config
              key: forgejo-user-token
          - name: ATLANTIS_GITEA_WEBHOOK_SECRET
            secretKeyRef:
              name: atlantis-config
              key: forgejo-webhook-secret
        loadEnvFromSecrets:
          - atlantis-environment
        extraVolumes:
          - name: vault-tokens
            projected:
              sources:
                - serviceAccountToken:
                    path: homelab
                    audience: https://vault.derwitt.site
                    expirationSeconds: 3600
                - serviceAccountToken:
                    path: cloud
                    audience: https://vault.derwitt.dev
                    expirationSeconds: 3600
          # Exchanged with Entra ID by the azurerm and azuread providers and the state backend.
          - name: azure-identity-token
            projected:
              sources:
                - serviceAccountToken:
                    path: azure-identity-token
                    audience: api://AzureADTokenExchange
                    expirationSeconds: 3600
        extraVolumeMounts:
          - name: vault-tokens
            mountPath: /var/run/secrets/vault
            readOnly: true
          - name: azure-identity-token
            mountPath: /var/run/secrets/azure/tokens
            readOnly: true
        volumeClaim:
          dataStorage: 5Gi
          storageClassName: proxmox-data
        containerSecurityContext:
          allowPrivilegeEscalation: false
          runAsUser: 100
          runAsGroup: 1000
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
        statefulSet:
          securityContext:
            fsGroup: 1000
            runAsUser: 100
            runAsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
            seccompProfile:
              type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 50Mi
          limits:
            memory: 256Mi
        service:
          type: ClusterIP
        ingress:
          enabled: false
        webhook_ingress:
          enabled: false
        route:
          main:
            enabled: true
            hostnames:
              - atlantis.derwitt.site
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: derwitt-site-gateway
                namespace: traefik
        repoConfig: |

          repos:
            - id: git.derwitt.site/homelab/terraform
              apply_requirements: [mergeable]
              allowed_overrides: [workflow]
              allow_custom_workflows: true
              delete_source_branch_on_merge: true
