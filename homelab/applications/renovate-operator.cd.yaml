---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-renovate-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: homelab
    namespace: renovate-operator
  source:
    repoURL: oci://ghcr.io/mogenius/helm-charts/renovate-operator
    path: "."
    targetRevision: 6.0.0
    helm:
      releaseName: renovate-operator
      valuesObject:
        replicaCount: 2

        config:
          deleteSuccessfulJobs: true
          logStorage:
            mode: valkey

        policy:
          enabled: true
          allowedHosts:
            - api.github.com
            - github.com
            - git.derwitt.site
            - api.renovate.derwitt.dev

        externalKeyValueStore:
          host: renovate-operator-valkey.renovate-operator.svc.cluster.local
          username: default
          existingSecret:
            name: renovate-operator-valkey-credentials
            passwordKey: default-password

        valkey:
          enabled: false

        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
          dashboard:
            enabled: true

        webhook:
          enabled: true
          route:
            enabled: true
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: derwitt-site-gateway
                namespace: traefik
            hostnames:
              - api.renovate.derwitt.site
        route:
          enabled: true
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: derwitt-site-gateway
              namespace: traefik
          hostnames:
            - renovate.derwitt.site
