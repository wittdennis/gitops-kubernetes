---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: homelab
    namespace: cert-manager
  source:
    repoURL: https://charts.jetstack.io
    targetRevision: v1.21.0
    chart: cert-manager
    helm:
      releaseName: cert-manager
      valuesObject:
        crds:
          enabled: true
        config:
          apiVersion: controller.config.cert-manager.io/v1alpha1
          kind: ControllerConfiguration
          enableGatewayAPI: true
        extraArgs:
          - --logging-format=json
        # plain port 53 queries never leave the network, the isp answers them
        # from its own resolver which does not see the acme challenge records.
        # doh (rfc 8484) over 443 cannot be intercepted, ip literals avoid
        # needing to resolve the resolver itself
        dns01RecursiveNameservers: "https://1.1.1.1/dns-query,https://8.8.8.8/dns-query"
        dns01RecursiveNameserversOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 100Mi
          limits:
            memory: 100Mi
        webhook:
          replicaCount: 3
          extraArgs:
            - --logging-format=json
          networkPolicy:
            enabled: false
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
            limits:
              memory: 100Mi
        cainjector:
          enabled: true
          replicaCount: 3
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          extraArgs:
            - --logging-format=json
          resources:
            requests:
              cpu: 10m
              memory: 114Mi
            limits:
              cpu: 2000m
              memory: 256Mi
        startupapicheck:
          extraArgs:
            - --logging-format=json
            - -v
        prometheus:
          servicemonitor:
            enabled: true
