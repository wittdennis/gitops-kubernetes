---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-headscale-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/client-side-apply-migration-manager: argocd-controller
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - ServerSideApply=true
  destination:
    name: homelab
    namespace: headscale-operator
  source:
    repoURL: oci://ghcr.io/mogenius/helm-charts/headscale-operator
    targetRevision: 0.6.5
    path: "."
    helm:
      releaseName: headscale-operator
      valuesObject:
        imagePullSecrets:
          - name: headscale-operator-image-pull-secret
