---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-litellm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: homelab
    namespace: ai-platform
  source:
    repoURL: oci://ghcr.io/berriai/litellm-helm
    path: "."
    targetRevision: 1.94.1
    helm:
      releaseName: litellm
      valuesObject:
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        # Container-level too: the migration Job pod gets no podSecurityContext
        # in this chart, so runAsNonRoot/seccompProfile must sit here to satisfy
        # the namespace's restricted pod-security policy.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL

        db:
          useExisting: true
          deployStandalone: false
          endpoint: litellm-postgres-rw.ai-platform.svc.cluster.local
          database: litellm
          secret:
            name: litellm-postgres-app
            usernameKey: username
            passwordKey: password

        masterkeySecretName: litellm-masterkey
        masterkeySecretKey: masterkey

        environmentSecrets:
          - litellm-provider-keys

        serviceMonitor:
          enabled: true

        migrationJob:
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi

        proxy_config:
          model_list:
            # Name aliases after the real model so the picker shows what it is
            # (and its cost tier). Local Ollama models get their own real names
            # once the GPU node is up (see issue #884).
            - model_name: claude-opus-4-8
              litellm_params:
                model: anthropic/claude-opus-4-8
                api_key: os.environ/ANTHROPIC_API_KEY
            - model_name: claude-sonnet-5
              litellm_params:
                model: anthropic/claude-sonnet-5
                api_key: os.environ/ANTHROPIC_API_KEY
            - model_name: claude-haiku-4-5
              litellm_params:
                model: anthropic/claude-haiku-4-5
                api_key: os.environ/ANTHROPIC_API_KEY
          litellm_settings:
            callbacks: ["prometheus"]
            require_auth_for_metrics_endpoint: false
          general_settings:
            master_key: os.environ/PROXY_MASTER_KEY
