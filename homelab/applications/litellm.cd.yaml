---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-litellm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: homelab
    namespace: ai-platform
  source:
    repoURL: oci://ghcr.io/berriai/litellm-helm
    path: "."
    targetRevision: 1.94.1
    helm:
      releaseName: litellm
      valuesObject:
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        # Container-level too: the migration Job pod gets no podSecurityContext
        # in this chart, so runAsNonRoot/seccompProfile must sit here to satisfy
        # the namespace's restricted pod-security policy.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL

        db:
          useExisting: true
          deployStandalone: false
          endpoint: litellm-postgres-rw.ai-platform.svc.cluster.local
          database: litellm
          secret:
            name: litellm-postgres-app
            usernameKey: username
            passwordKey: password

        masterkeySecretName: litellm-masterkey
        masterkeySecretKey: masterkey

        environmentSecrets:
          - litellm-provider-keys

        serviceMonitor:
          enabled: true

        # The standalone migration Job never exits (its entrypoint starts the
        # proxy's background loops after migrating) and blocks the ArgoCD PreSync
        # hook forever. Single replica, so let the proxy apply the schema on
        # startup instead (this also un-sets the chart's DISABLE_SCHEMA_UPDATE).
        migrationJob:
          enabled: false

        # Off BestEffort; 2Gi ceiling covers the transient startup schema step
        # (steady-state ~0.5Gi).
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi

        nodeSelector:
          derwitt.site/ai: "true"

        proxy_config:
          model_list:
            # Name aliases after the real model so the picker shows what it is
            # (and its cost tier).
            - model_name: claude-opus-4-8
              litellm_params:
                model: anthropic/claude-opus-4-8
                api_key: os.environ/ANTHROPIC_API_KEY
            - model_name: claude-sonnet-5
              litellm_params:
                model: anthropic/claude-sonnet-5
                api_key: os.environ/ANTHROPIC_API_KEY
            - model_name: claude-haiku-4-5
              litellm_params:
                model: anthropic/claude-haiku-4-5
                api_key: os.environ/ANTHROPIC_API_KEY
            # Local Ollama on the Arc B580 (#884). Models must be pulled into the
            # ollama PVC (`ollama pull <name>`) before a route resolves. One 7B-ish
            # model fits 12 GB at a time; ollama_chat/ auto-swaps them on demand.
            - model_name: llama3.1:8b
              litellm_params:
                model: ollama_chat/llama3.1:8b
                api_base: http://ollama.ai-platform.svc.cluster.local:11434
            - model_name: qwen2.5-coder:7b
              litellm_params:
                model: ollama_chat/qwen2.5-coder:7b
                api_base: http://ollama.ai-platform.svc.cluster.local:11434
            - model_name: qwen3.5:9b
              litellm_params:
                model: ollama_chat/qwen3.5:9b
                api_base: http://ollama.ai-platform.svc.cluster.local:11434
            - model_name: nomic-embed-text
              litellm_params:
                model: ollama/nomic-embed-text
                api_base: http://ollama.ai-platform.svc.cluster.local:11434
          litellm_settings:
            callbacks: ["prometheus"]
            require_auth_for_metrics_endpoint: false
          general_settings:
            master_key: os.environ/PROXY_MASTER_KEY
