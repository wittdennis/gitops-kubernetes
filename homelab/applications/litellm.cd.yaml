---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-litellm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: homelab
    namespace: ai-platform
  source:
    repoURL: oci://ghcr.io/berriai/litellm-helm
    path: "."
    targetRevision: 1.97.0
    helm:
      releaseName: litellm
      valuesObject:
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        # Container-level too: the migration Job pod gets no podSecurityContext
        # in this chart, so runAsNonRoot/seccompProfile must sit here to satisfy
        # the namespace's restricted pod-security policy.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL

        db:
          useExisting: true
          deployStandalone: false
          endpoint: litellm-postgres-rw.ai-platform.svc.cluster.local
          database: litellm
          secret:
            name: litellm-postgres-app
            usernameKey: username
            passwordKey: password

        masterkeySecretName: litellm-masterkey
        masterkeySecretKey: masterkey

        environmentSecrets:
          - litellm-provider-keys
          - litellm-otter-token

        serviceMonitor:
          enabled: true

        # The standalone migration Job never exits (its entrypoint starts the
        # proxy's background loops after migrating) and blocks the ArgoCD PreSync
        # hook forever. Single replica, so let the proxy apply the schema on
        # startup instead (this also un-sets the chart's DISABLE_SCHEMA_UPDATE).
        migrationJob:
          enabled: false

        # Off BestEffort; 2Gi ceiling covers the transient startup schema step
        # (steady-state ~0.5Gi).
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi

        nodeSelector:
          derwitt.site/ai: "true"

        proxy_config:
          model_list:
            # Name aliases after the real model so the picker shows what it is
            # (and its cost tier).
            - model_name: anthropic:claude-opus-4-8
              litellm_params:
                model: anthropic/claude-opus-4-8
                api_key: os.environ/ANTHROPIC_API_KEY
            - model_name: anthropic:claude-sonnet-5
              litellm_params:
                model: anthropic/claude-sonnet-5
                api_key: os.environ/ANTHROPIC_API_KEY
            - model_name: anthropic:claude-haiku-4-5
              litellm_params:
                model: anthropic/claude-haiku-4-5
                api_key: os.environ/ANTHROPIC_API_KEY
            # Local Ollama on the Arc B580 Models. One 7B-ish
            # model fits 12 GB at a time; ollama_chat/ auto-swaps them on demand.
            - model_name: b580:llama3.1:8b
              litellm_params:
                model: ollama_chat/llama3.1:8b
                api_base: http://ollama.ai-platform.svc.cluster.local:11434
                drop_params: true
                num_ctx: 8192
            - model_name: b580:qwen2.5-coder:7b
              litellm_params:
                model: ollama_chat/qwen2.5-coder:7b
                api_base: http://ollama.ai-platform.svc.cluster.local:11434
                drop_params: true
            - model_name: b580:qwen3.5:9b
              litellm_params:
                model: ollama_chat/qwen3.5:9b
                api_base: http://ollama.ai-platform.svc.cluster.local:11434
                drop_params: true
            # 7900 XTX Models
            - model_name: xtx:qwen3-coder:30b
              litellm_params:
                model: ollama_chat/qwen3-coder:30b
                api_base: https://ollama.otter.derwitt.site:11434
                api_key: os.environ/OTTER_OLLAMA_TOKEN
                drop_params: true
                num_ctx: 32768
                # Detecting an absent box, not waiting for a slow one. Generation itself is
                # covered by stream_timeout, which only has to cover time-to-first-token.
                timeout: 2
                stream_timeout: 30
              # num_ctx is the whole window, prompt and completion together, and a client
              # that does not know the server's value infers the model's architectural
              # maximum instead and overfills it. Advertising the real budget, with room
              # reserved for the reply, is what stops that guess being wrong.
              model_info:
                max_input_tokens: 24576
                max_output_tokens: 8192
            - model_name: xtx:qwen3.6:27b
              litellm_params:
                model: ollama_chat/qwen3.6:27b
                api_base: https://ollama.otter.derwitt.site:11434
                api_key: os.environ/OTTER_OLLAMA_TOKEN
                drop_params: true
                # Twice the server default, and free on this model: measured 100% on the GPU
                # at 20.4 GB and the same 36 tok/s as half the window. Agent loops accumulate
                # tool output quickly, and running out of window truncates a reply rather
                # than reporting anything useful.
                num_ctx: 73728
                timeout: 2
                stream_timeout: 30
              model_info:
                # num_ctx - max_output_tokens
                max_input_tokens: 65536
                # number of tokens one wants to dedicate to output
                max_output_tokens: 8192
            - model_name: xtx:qwen3.8:27b
              litellm_params:
                model: ollama_chat/qwen3.8:27b
                api_base: https://ollama.otter.derwitt.site:11434
                api_key: os.environ/OTTER_OLLAMA_TOKEN
                drop_params: true
                # Twice the server default, and free on this model: measured 100% on the GPU
                # at 20.4 GB and the same 36 tok/s as half the window. Agent loops accumulate
                # tool output quickly, and running out of window truncates a reply rather
                # than reporting anything useful.
                num_ctx: 73728
                timeout: 2
                stream_timeout: 30
              model_info:
                # num_ctx - max_output_tokens
                max_input_tokens: 65536
                # number of tokens one wants to dedicate to output
                max_output_tokens: 8192
            # Embeddings stay on the B580 alone and carry no fallback anywhere. Vectors from
            # two different models do not share a space, so a fallback here would return
            # unrelated chunks with no error raised: a wrong answer rather than an outage.
            - model_name: b580:nomic-embed-text
              litellm_params:
                model: ollama/nomic-embed-text
                api_base: http://ollama.ai-platform.svc.cluster.local:11434
                drop_params: true
          router_settings:
            # Degrade along quality, not availability: the request completes on the
            # always-on card rather than failing when the workstation is off.
            #
            # Local only, and never onto a cloud model. Those are metered, so reaching one
            # has to be something the caller chose by picking it, not something that happens
            # quietly because a machine at home was switched off.
            fallbacks:
              - "xtx:qwen3-coder:30b": ["b580:qwen2.5-coder:7b"]
              - "xtx:qwen3.6:27b": ["b580:qwen3.5:9b"]
            # Router-wide, since this release has no per-deployment cooldown. The default is
            # 5s, which for a machine that is off for hours means re-probing it constantly
            # and paying the timeout each time. At 300s a dead backend costs one slow request
            # every five minutes and every other request falls back immediately.
            # The cost is borne by the cloud entries too: three consecutive failures there
            # now mean five minutes of hard failure instead of five seconds.
            cooldown_time: 300
          litellm_settings:
            callbacks: ["prometheus"]
            require_auth_for_metrics_endpoint: false
          general_settings:
            master_key: os.environ/PROXY_MASTER_KEY
            # A backend that is down most of the day would otherwise be probed forever, and
            # the answer is already known from the fallback rate.
            background_health_checks: false
