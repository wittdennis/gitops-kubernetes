---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-radicale
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  # the backup workflow scales this to 0 for the duration of the backup; without this, a
  # sync landing mid-backup reasserts replicas: 1 and races the backup pod's PVC attach
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: homelab-radicale
      namespace: radicale
      jsonPointers:
        - /spec/replicas
  destination:
    name: homelab
    namespace: radicale
  source:
    repoURL: oci://ghcr.io/wittdennis/helm-charts/radicale
    path: "."
    targetRevision: 2.1.0
    helm:
      valuesObject:
        config:
          auth:
            type: htpasswd
            htpasswd:
              existingSecret: radicale-auth-htpasswd

        persistence:
          data:
            enabled: true
            className: proxmox-data
            size: 1Gi
        route:
          enabled: true
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: derwitt-site-gateway
              namespace: traefik
          hostnames:
            - calendar.derwitt.site
