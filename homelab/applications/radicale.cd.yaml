---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-radicale
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: homelab
    namespace: radicale
  source:
    repoURL: https://charts.derwitt.dev
    chart: radicale
    targetRevision: 2.0.2
    helm:
      valuesObject:
        config:
          auth:
            type: htpasswd
            htpasswd:
              existingSecret: radicale-auth-htpasswd

        persistence:
          data:
            enabled: true
            className: proxmox-data
            size: 1Gi
        route:
          enabled: true
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: derwitt-site-gateway
              namespace: traefik
          hostnames:
            - calendar.derwitt.site
