---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-garage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: homelab
    namespace: storage
  source:
    repoURL: oci://ghcr.io/wittdennis/helm-charts/garage
    path: "."
    targetRevision: 2.4.0
    helm:
      valuesObject:
        commonLabels:
          storage/tenant: default

        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: storage/tenant
                      operator: In
                      values:
                        - default
                topologyKey: kubernetes.io/hostname

        garage:
          # -- Can be changed for better performance on certain systems
          # https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#db_engine
          dbEngine: "lmdb"
          # -- Defaults is 1MB
          # An increase can result in better performance in certain scenarios
          # https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#block-size
          blockSize: "1048576"
          # -- Default to 3 replicas, see the replication_mode section at
          # https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#replication-mode
          replicationMode: "3"
          # -- zstd compression level of stored blocks
          # https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#compression-level
          compressionLevel: "1"
          # -- If this value is set, Garage will automatically take a snapshot of the metadata DB file at a regular interval and save it in the metadata directory.
          # https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#metadata_auto_snapshot_interval
          metadataAutoSnapshotInterval: "6h"
          rpc:
            secret:
              create: false
              name: garage-rpc
          # -- This is not required if you use the integrated kubernetes discovery
          bootstrapPeers: []
          # -- Set to true if you want to use k8s discovery but install the CRDs manually outside
          # of the helm chart, for example if you operate at namespace level without cluster ressources
          kubernetesSkipCrd: false
          s3:
            api:
              region: "homelab"
              rootDomain: ".s3.derwitt.site"
            web:
              rootDomain: ".derwitt.site"
              index: "index.html"

        # Data persistence
        persistence:
          enabled: true
          meta:
            storageClass: "proxmox-data"
            size: 5Gi
            # used only for daemon sets
            hostPath: /var/lib/garage/meta
          data:
            storageClass: "proxmox-data"
            size: 50Gi
            # used only for daemon sets
            hostPath: /var/lib/garage/data

        # Deployment configuration
        deployment:
          # -- Switchable to DaemonSet
          kind: StatefulSet
          # -- Number of StatefulSet replicas/garage nodes to start
          replicaCount: 3
          # -- If using statefulset, allow Parallel or OrderedReady (default)
          podManagementPolicy: OrderedReady

        serviceAccount:
          create: false

        # -- additonal pod annotations
        podAnnotations: {}

        podSecurityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true

        service:
          type: ClusterIP
          s3:
            api:
              port: 3900
            web:
              port: 3902
            # NOTE: the admin API is excluded for now as it is not consistent across nodes

        routes:
          s3:
            api:
              enabled: true
              parentRefs:
                - group: gateway.networking.k8s.io
                  kind: Gateway
                  name: derwitt-site-gateway
                  namespace: traefik
              hostnames:
                - s3.derwitt.site
                - "*.s3.derwitt.site"

        ingress:
          s3:
            api:
              enabled: false
            web:
              enabled: false

        resources:
          # The following are indicative for a small-size deployement, for anything serious double them.
          limits:
            cpu: 100m
            memory: 1024Mi
          requests:
            cpu: 100m
            memory: 512Mi

        # -- Specifies a livenessProbe
        livenessProbe: {}
          # httpGet:
          #   path: /health
          #   port: 3903
          # initialDelaySeconds: 5
          # periodSeconds: 30
        # -- Specifies a readinessProbe
        readinessProbe: {}
          # httpGet:
          #   path: /health
          #   port: 3903
          # initialDelaySeconds: 5
          # periodSeconds: 30

        monitoring:
          metrics:
            # -- If true, a service for monitoring is created with a prometheus.io/scrape annotation
            enabled: true
            serviceMonitor:
              enabled: true
              path: /metrics
              labels: {}
              interval: 15s
              scheme: http
              tlsConfig: {}
              scrapeTimeout: 10s
              relabelings:
                - action: replace
                  targetLabel: tenant
                  replacement: default
                - action: replace
                  targetLabel: system
                  replacement: garage
          tracing:
            # -- specify a sink endpoint for OpenTelemetry Traces, eg. `http://localhost:4317`
            sink: ""
          grafanaDashboard:
            # -- If enabled deploys the grafana dashboard as configmap
            enabled: true
            annotations: {}
