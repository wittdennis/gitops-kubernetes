---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-calibre-web
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: homelab
    namespace: calibre-web
  source:
    repoURL: oci://ghcr.io/wittdennis/helm-charts/calibre-web
    path: "."
    targetRevision: 1.1.0
    helm:
      valuesObject:
        env:
          - name: TZ
            value: Europe/Berlin

        persistence:
          config:
            enabled: true
            className: proxmox-data
            size: 1Gi
          data:
            enabled: true
            className: proxmox-data
            size: 50Gi

        route:
          enabled: true
          hostnames:
            - books.derwitt.site
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: derwitt-site-gateway
              namespace: traefik
