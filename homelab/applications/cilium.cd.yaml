---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-cilium
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: homelab
    namespace: kube-system
  ignoreDifferences:
    - kind: Secret
      name: cilium-ca
      namespace: kube-system
      jsonPointers:
        - /data/ca.crt
        - /data/ca.key
    - kind: Secret
      name: hubble-relay-client-certs
      namespace: kube-system
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
    - kind: Secret
      name: hubble-server-certs
      namespace: kube-system
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
  source:
    repoURL: https://helm.cilium.io
    targetRevision: 1.20.1
    chart: cilium
    helm:
      releaseName: cilium
      values: |

        ipam:
          mode: kubernetes
        kubeProxyReplacement: true
        encryption:
          enabled: true
          type: wireguard
          nodeEncryption: true
        gatewayAPI:
          enabled: false
          enableProxyProtocol: false
          externalTrafficPolicy: Cluster
          enableAppProtocol: true
          enableAlpn: true
        securityContext:
          capabilities:
            ciliumAgent:
              - CHOWN
              - KILL
              - NET_ADMIN
              - NET_RAW
              - IPC_LOCK
              - SYS_ADMIN
              - SYS_RESOURCE
              - DAC_OVERRIDE
              - FOWNER
              - SETGID
              - SETUID
            cleanCiliumState:
              - NET_ADMIN
              - SYS_ADMIN
              - SYS_RESOURCE
        cgroup:
          autoMount:
            enabled: true
          hostRoot: /sys/fs/cgroup
        k8sServiceHost: localhost
        k8sServicePort: 7445
        bgpControlPlane:
          enabled: false
        ingressController:
          enabled: false
          loadBalancerMode: dedicated
        hubble:
          enabled: true
          relay:
            enabled: true
          metrics:
            enabled:
              - dns:query;ignoreAAAA
              - drop
              - tcp
              - flow
              - icmp
              - http
            serviceMonitor:
              enabled: true
            dashboards:
              enabled: true
              namespace: victoria-metrics-stack
          ui:
            enabled: true
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true
