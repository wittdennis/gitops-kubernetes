---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-connection-url
spec:
  refreshInterval: "1h0m0s"
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  target:
    name: valkey-connection-url
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        url: "redis://penpot:{{ .penpot_password | urlquery }}@penpot-valkey.penpot.svc.cluster.local:6379"
  data:
    - remoteRef:
        conversionStrategy: Default
        key: /penpot/valkey-credentials
        property: penpot-password
      secretKey: penpot_password
