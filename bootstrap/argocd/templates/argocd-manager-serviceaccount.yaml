---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-manager
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
  annotations:
    # Argo CD reaches this cluster through this account; removing it locks Argo CD out
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
