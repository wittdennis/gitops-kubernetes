---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/client-side-apply-migration-manager: argocd-controller
spec:
  project: app-of-apps
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - ServerSideApply=true
  destination:
    namespace: argocd
    server: {{ .Values.destination.server }}
  source:
    path: "."
    repoURL: https://git.derwitt.site/homelab/yggdrasil
    targetRevision: HEAD
    directory:
      exclude: "*.json"
