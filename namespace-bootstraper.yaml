---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: namespace-bootstraper
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: "{{ nameNormalized }}-namespace-bootstraper"
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: k8s-platform
      syncPolicy:
        automated:
          prune: true
      source:
        repoURL: https://github.com/wittdennis/k8s-platform
        targetRevision: HEAD
        path: "{{ nameNormalized }}/namespaces"
      destination:
        server: "{{ server }}"
