---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant-external-secrets-resources
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/client-side-apply-migration-manager: argocd-controller
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - ServerSideApply=true
  destination:
    name: home-assistant
    namespace: external-secrets
  source:
    repoURL: https://git.derwitt.site/homelab/yggdrasil
    targetRevision: HEAD
    path: "home-assistant/external-secrets"
    directory:
      recurse: true
