---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant-external-dns-resources
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: home-assistant
    namespace: external-dns
  source:
    repoURL: https://git.derwitt.site/homelab/yggdrasil
    targetRevision: HEAD
    path: "home-assistant/external-dns"
    directory:
      recurse: true
