---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant-prometheus-operator-crds
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/client-side-apply-migration-manager: argocd-controller
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - ServerSideApply=true
  destination:
    name: home-assistant
    namespace: victoria-metrics-stack
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 33.0.2
    chart: prometheus-operator-crds
    helm:
      releaseName: prometheus-operator-crds
