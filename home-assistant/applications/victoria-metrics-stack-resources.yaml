---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant-victoria-metrics-stack-resources
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: home-assistant
    namespace: victoria-metrics-stack
  source:
    repoURL: https://github.com/wittdennis/k8s-platform
    targetRevision: HEAD
    path: "home-assistant/victoria-metrics-stack"
    directory:
      recurse: true
