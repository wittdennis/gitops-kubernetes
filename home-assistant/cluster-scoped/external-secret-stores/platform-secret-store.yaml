---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend-platform
spec:
  provider:
    vault:
      server: "https://vault.derwitt.site"
      path: "platform"
      version: "v2"
      auth:
        jwt:
          path: jwt-home-assistant
          role: eso-platform
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: eso-platform
              namespace: external-secrets
              audiences:
                - https://vault.derwitt.site
