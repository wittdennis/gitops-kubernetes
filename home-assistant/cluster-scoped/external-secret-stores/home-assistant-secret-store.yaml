---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend-home-assistant
spec:
  provider:
    vault:
      server: "https://vault.derwitt.site"
      path: "home-assistant"
      version: "v2"
      auth:
        jwt:
          path: jwt-home-assistant
          role: eso-home-assistant
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: eso-home-assistant
              namespace: external-secrets
              audiences:
                - https://vault.derwitt.site
