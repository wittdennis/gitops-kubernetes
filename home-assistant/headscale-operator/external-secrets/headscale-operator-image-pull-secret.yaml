---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-operator-image-pull-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-home-assistant
    kind: ClusterSecretStore
  target:
    name: headscale-operator-image-pull-secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .password
          }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - remoteRef:
        conversionStrategy: Default
        key: /headscale-operator/ghcr-pull-credentials
        property: username
      secretKey: username
    - remoteRef:
        conversionStrategy: Default
        key: /headscale-operator/ghcr-pull-credentials
        property: token
      secretKey: password
