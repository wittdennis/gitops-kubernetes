---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argo-workflows-rules
spec:
  groups:
    - name: argo-workflows.rules
      rules:
        - alert: ArgoWorkflowFailed
          annotations:
            description: "Argo-Workflow {{ $labels.name }} in namespace {{ $labels.namespace }} has failed. Please investigate."
            summary: Argo Workflow has failed.
          # Derived from the Workflow object, so this keeps firing until the failed
          # workflow is deleted. CronWorkflows here set failedJobsHistoryLimit: 1 and
          # no TTL, so a later successful run does not clear it.
          expr: kube_customresource_workflow_status_phase{phase=~"(Error|Failed)"} == 1
          for: 15m
          labels:
            severity: warning
