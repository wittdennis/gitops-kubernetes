---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: derwitt-site-cluster-issuer
spec:
  acme:
    email: dennis@derwitt.de
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: derwitt-site-cluster-issuer-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: derwitt-site-cloudflare-api-token
              key: api-token
