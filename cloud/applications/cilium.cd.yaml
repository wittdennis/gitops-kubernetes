---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-cilium
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - ServerSideApply=true
  destination:
    name: cloud
    namespace: kube-system
  ignoreDifferences:
    - kind: Secret
      name: cilium-ca
      namespace: kube-system
      jsonPointers:
        - /data/ca.crt
        - /data/ca.key
    - kind: Secret
      name: hubble-relay-client-certs
      namespace: kube-system
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
    - kind: Secret
      name: hubble-server-certs
      namespace: kube-system
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
  source:
    repoURL: https://helm.cilium.io
    targetRevision: 1.20.1
    chart: cilium
    helm:
      releaseName: cilium
      valuesObject:
        encryption:
          enabled: true
          type: wireguard
          nodeEncryption: true
        kubeProxyReplacement: true
        k8sServiceHost: "127.0.0.1"
        k8sServicePort: "443"
        # Match the NIC prefix, not exact names; excludes the tailscale0 (1280 MTU) overlay.
        devices: "eth+"
        # ConfigMap changes must restart agents/operator; GitOps has no other trigger.
        rollOutCiliumPods: true
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        bandwidthManager:
          enabled: true
          bbr: true
        loadBalancer:
          algorithm: maglev
        bpf:
          masquerade: true
          datapathMode: netkit
        operator:
          hostNetwork: true
          rollOutPods: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
        hubble:
          enabled: true
          relay:
            enabled: true
          metrics:
            enableOpenMetrics: true
            enabled:
              - dns:query;ignoreAAAA
              - drop
              - tcp
              - flow
              - icmp
              - http
            serviceMonitor:
              enabled: true
            dashboards:
              enabled: true
              namespace: victoria-metrics-stack
          ui:
            enabled: true
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true
        dashboards:
          enabled: true
          namespace: victoria-metrics-stack
        envoy:
          prometheus:
            enabled: true
            serviceMonitor:
              enabled: true
