---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-hcloud-csi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: cloud
    namespace: kube-system
  source:
    repoURL: https://charts.hetzner.cloud
    targetRevision: 2.21.2
    chart: hcloud-csi
    helm:
      releaseName: hcloud-csi
      valuesObject:
        controller:
          replicaCount: 2
          hcloudVolumeDefaultLocation: fsn1
          priorityClassName: "system-cluster-critical"
          resources:
            csiAttacher:
              limits:
                memory: 80Mi
                cpu: 50m
              requests:
                memory: 20Mi
                cpu: 10m
            csiResizer:
              limits:
                memory: 80Mi
                cpu: 50m
              requests:
                memory: 20Mi
                cpu: 10m
            csiProvisioner:
              limits:
                memory: 80Mi
                cpu: 50m
              requests:
                memory: 20Mi
                cpu: 10m
            livenessProbe:
              limits:
                memory: 80Mi
                cpu: 50m
              requests:
                memory: 20Mi
                cpu: 10m
            hcloudCSIDriver:
              limits:
                memory: 80Mi
                cpu: 100m
              requests:
                memory: 40Mi
                cpu: 10m
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: csi-hcloud
                        operator: In
                        values:
                          - controller
                  topologyKey: "kubernetes.io/hostname"

        node:
          priorityClassName: "system-node-critical"
          resources:
            csiNodeDriverRegistrar:
              limits:
                memory: 40Mi
                cpu: 50m
              requests:
                memory: 20Mi
                cpu: 10m
            livenessProbe:
              limits:
                memory: 40Mi
                cpu: 50m
              requests:
                memory: 20Mi
                cpu: 10m
            hcloudCSIDriver:
              limits:
                memory: 80Mi
                cpu: 100m
              requests:
                memory: 40Mi
                cpu: 10m
          hostNetwork: true
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: "node-role.kubernetes.io/control-plane"
                        operator: NotIn
                        values:
                          - ""

        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
