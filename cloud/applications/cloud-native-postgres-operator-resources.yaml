---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-cloud-native-postgres-operator-resources
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: cloud
    namespace: cloud-native-postgres-operator
  source:
    repoURL: https://git.derwitt.site/homelab/yggdrasil
    targetRevision: HEAD
    path: "cloud/cloud-native-postgres-operator"
    directory:
      recurse: true
