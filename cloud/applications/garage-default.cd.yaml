---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-garage-default
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: cloud
    namespace: storage
  source:
    repoURL: https://charts.derwitt.dev
    chart: garage
    targetRevision: 2.3.2
    helm:
      valuesObject:
        image:
          repository: dxflrs/arm64_garage

        commonLabels:
          storage/tenant: default

        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: storage/tenant
                      operator: In
                      values:
                        - default
                topologyKey: kubernetes.io/hostname

        garage:
          # -- Can be changed for better performance on certain systems
          # https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#db_engine
          dbEngine: "lmdb"
          # -- Defaults is 1MB
          # An increase can result in better performance in certain scenarios
          # https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#block-size
          blockSize: "1048576"
          # -- Default to 3 replicas, see the replication_mode section at
          # https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#replication-mode
          replicationMode: "3"
          # -- zstd compression level of stored blocks
          # https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#compression-level
          compressionLevel: "1"
          # -- If this value is set, Garage will automatically take a snapshot of the metadata DB file at a regular interval and save it in the metadata directory.
          # https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#metadata_auto_snapshot_interval
          metadataAutoSnapshotInterval: "6h"
          rpc:
            secret:
              create: false
              name: garage-rpc
          # -- This is not required if you use the integrated kubernetes discovery
          bootstrapPeers: []
          # -- Set to true if you want to use k8s discovery but install the CRDs manually outside
          # of the helm chart, for example if you operate at namespace level without cluster ressources
          kubernetesSkipCrd: false
          s3:
            api:
              region: "cloud"
              rootDomain: ".s3.derwitt.dev"
            web:
              rootDomain: ".derwitt.dev"
              index: "index.html"

        # Data persistence
        persistence:
          enabled: true
          meta:
            storageClass: "longhorn"
            size: 2Gi
            # used only for daemon sets
            hostPath: /var/lib/garage/meta
          data:
            storageClass: "hcloud-volumes"
            size: 20Gi
            # used only for daemon sets
            hostPath: /var/lib/garage/data

        # Deployment configuration
        deployment:
          # -- Switchable to DaemonSet
          kind: StatefulSet
          # -- Number of StatefulSet replicas/garage nodes to start
          replicaCount: 3
          # -- If using statefulset, allow Parallel or OrderedReady (default)
          podManagementPolicy: OrderedReady

        serviceAccount:
          create: false

        # -- additonal pod annotations
        podAnnotations: {}

        podSecurityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true

        service:
          type: ClusterIP
          s3:
            api:
              port: 3900
            web:
              port: 3902
            # NOTE: the admin API is excluded for now as it is not consistent across nodes

        ingress:
          s3:
            api:
              enabled: true
              className: "traefik"
              annotations:
                cert-manager.io/cluster-issuer: letsencrypt
                traefik.ingress.kubernetes.io/router.middlewares: "traefik-redirect-to-https@kubernetescrd"
              labels: {}
              hosts:
                # -- garage S3 API endpoint, to be used with awscli for example
                - host: "s3.derwitt.dev"
                  paths:
                    - path: /
                      pathType: Prefix
                # -- garage S3 API endpoint, DNS style bucket access
                - host: "*.s3.derwitt.dev"
                  paths:
                    - path: /
                      pathType: Prefix
              tls:
                - secretName: s3-garage-default-ingress-tls
                  hosts:
                    - s3.derwitt.dev
                    - "*.s3.derwitt.dev"
            web:
              enabled: false
              className: "traefik"
              annotations:
                cert-manager.io/cluster-issuer: letsencrypt
                traefik.ingress.kubernetes.io/router.middlewares: "traefik-redirect-to-https@kubernetescrd"
              labels: {}
              hosts:
                # --  wildcard website access with bucket name prefix
                - host: "*.derwitt.dev"
                  paths:
                    - path: /
                      pathType: Prefix
                # -- specific bucket access with FQDN bucket
                # - host: "mywebpage.example.com"
                #   paths:
                #     - path: /
                #       pathType: Prefix
              tls:
                - secretName: web-garage-default-ingress-tls
                  hosts:
                    - "*.derwitt.dev"

        resources:
          # The following are indicative for a small-size deployement, for anything serious double them.
          limits:
            cpu: 100m
            memory: 1024Mi
          requests:
            cpu: 100m
            memory: 512Mi

        # -- Specifies a livenessProbe
        livenessProbe: {}
          # httpGet:
          #   path: /health
          #   port: 3903
          # initialDelaySeconds: 5
          # periodSeconds: 30
        # -- Specifies a readinessProbe
        readinessProbe: {}
          # httpGet:
          #   path: /health
          #   port: 3903
          # initialDelaySeconds: 5
          # periodSeconds: 30

        monitoring:
          metrics:
            # -- If true, a service for monitoring is created with a prometheus.io/scrape annotation
            enabled: true
            serviceMonitor:
              enabled: true
              path: /metrics
              labels: {}
              interval: 15s
              scheme: http
              tlsConfig: {}
              scrapeTimeout: 10s
              relabelings: []
          tracing:
            # -- specify a sink endpoint for OpenTelemetry Traces, eg. `http://localhost:4317`
            sink: ""
          grafanaDashboard:
            # -- If enabled deploys the grafana dashboard as configmap
            enabled: true
            annotations: {}
