---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-external-secrets-resources
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: cloud
    namespace: external-secrets
  source:
    repoURL: https://github.com/wittdennis/k8s-platform
    targetRevision: HEAD
    path: "cloud/external-secrets"
    directory:
      recurse: true
