---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-prometheus-blackbox-exporter-resources
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-platform
  syncPolicy:
    automated:
      prune: true
  destination:
    name: cloud
    namespace: prometheus-blackbox-exporter
  source:
    repoURL: https://git.derwitt.site/homelab/yggdrasil
    targetRevision: HEAD
    path: "cloud/prometheus-blackbox-exporter"
    directory:
      recurse: true
