---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: argo-workflows-secret
spec:
  namespaceSelectors:
    - matchLabels:
        argo-workflows: "true"
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: vault-backend-platform
      kind: ClusterSecretStore
    target:
      name: argo-workflows
      creationPolicy: Owner
      deletionPolicy: Delete
    data:
      - remoteRef:
          conversionStrategy: Default
          decodingStrategy: None
          key: /shared/s3-workflows
          property: access-key
          metadataPolicy: None
          nullBytePolicy: Ignore
        secretKey: access-key
      - remoteRef:
          conversionStrategy: Default
          decodingStrategy: None
          key: /shared/s3-workflows
          property: secret-key
          metadataPolicy: None
          nullBytePolicy: Ignore
        secretKey: secret-key
