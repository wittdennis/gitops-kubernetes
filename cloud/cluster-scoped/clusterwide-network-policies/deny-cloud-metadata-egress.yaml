---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-cloud-metadata-egress
spec:
  endpointSelector: {}
  # Keeps selected pods out of egress/ingress default-deny; only the deny rule applies.
  enableDefaultDeny:
    egress: false
    ingress: false
  egressDeny:
    - toCIDR:
        - 169.254.169.254/32
