---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: add-cnpg-objectstore
  annotations:
    policies.kyverno.io/title: Create CNPG ObjectStore on Namespace Label
    policies.kyverno.io/description: |
      Automatically creates a CNPG ObjectStore when a namespace is labeled with big-direkt.de/postgres-backup: "true"
      This can probably be removed once ClusterObjectStore is available, see: https://github.com/cloudnative-pg/plugin-barman-cloud/issues/448
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
    objectSelector:
      matchExpressions:
        - key: postgres-backup
          operator: In
          values: ["true"]
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: barmancloud.cnpg.io/v1
          kind: ObjectStore
          metadata:
            name: backup-store
            namespace: ((object.metadata.name))
          spec:
            configuration:
              destinationPath: s3://pseud0random-cnpg-backups-cloud/
              endpointURL: https://fsn1.your-objectstorage.com
              s3Credentials:
                region:
                  name: postgres-backups-credentials
                  key: region
                accessKeyId:
                  name: postgres-backups-credentials
                  key: access-key
                secretAccessKey:
                  name: postgres-backups-credentials
                  key: secret-key
              wal:
                compression: gzip
            retentionPolicy: 14d
