---
# Reaches the homelab Vault over its public endpoint to pull canonical
# secrets (e.g. Authentik oauth2 client-secrets under platform/authentik/*)
# that must stay identical between homelab and cloud.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend-homelab-platform
spec:
  provider:
    vault:
      server: "https://vault.derwitt.site"
      path: "platform"
      version: "v2"
      auth:
        tokenSecretRef:
          name: "vault-homelab-platform-token"
          namespace: external-secrets
          key: "token"
