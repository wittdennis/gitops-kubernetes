---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend-foundry
spec:
  provider:
    vault:
      server: "https://vault.hashicorp-vault.svc.cluster.local:8200"
      path: "foundry"
      version: "v2"
      caProvider:
        type: Secret
        name: vault-server-cert
        namespace: hashicorp-vault
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-foundry
          serviceAccountRef:
            name: eso-foundry
            namespace: external-secrets
            audiences:
              - https://vault.derwitt.dev
