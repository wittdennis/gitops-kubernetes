---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: code-and-quest-de-letsencrypt
spec:
  acme:
    email: dennis@derwitt.de
    server: https://acme-v02.api.letsencrypt.org/directory
    preferredChain: "ISRG Root X2"
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-code-and-quest-de-api-token
              key: api-token
