---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: derwitt-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: derwitt CA
  secretName: derwitt-ca-cert
  duration: 43800h # 5 years
  renewBefore: 360h # 15 days
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 4096
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io
