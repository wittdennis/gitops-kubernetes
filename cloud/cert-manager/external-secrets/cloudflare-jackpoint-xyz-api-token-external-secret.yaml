---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-jackpoint-xyz-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  target:
    name: cloudflare-jackpoint-xyz-api-token
    creationPolicy: Owner
  data:
    - remoteRef:
        conversionStrategy: Default
        key: /cert-manager/cloudflare-jackpoint-xyz
        property: api-token
      secretKey: api-token
