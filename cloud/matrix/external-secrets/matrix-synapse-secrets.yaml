---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-synapse-secrets
spec:
  refreshInterval: "1h"
  target:
    name: matrix-synapse-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  data:
    - remoteRef:
        conversionStrategy: Default
        key: /matrix/synapse
        property: signing-key
      secretKey: signing-key
    - remoteRef:
        conversionStrategy: Default
        key: /matrix/synapse
        property: macaroon
      secretKey: macaroon
    - remoteRef:
        conversionStrategy: Default
        key: /matrix/synapse
        property: registration-shared-secret
      secretKey: registration-shared-secret
