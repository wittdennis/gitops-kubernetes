---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-rtc-secrets
spec:
  refreshInterval: "1h"
  target:
    name: matrix-rtc-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        livekit-secret: "{{ .livekitSecret }}"
        # Mirrors the chart's configs/matrix-rtc/registration.yaml.tpl for release "matrix" in namespace "matrix".
        registration.yaml: |
          id: matrix-rtc-authorisation-service
          as_token: "{{ .asToken }}"
          hs_token: "{{ .hsToken }}"
          sender_localpart: _lk_jwt_service
          namespaces:
            users:
              - exclusive: false
                regex: "@.*:jackpoint.xyz"
          url: null
          io.element.msc4502.scopes:
            - "urn:matrix:client:io.element.msc4502:rooms:is_joined"
          io.element.msc4512.proxy_prefix: rtc/livekit
          io.element.msc4512.proxy_url: "http://matrix-matrix-rtc-authorisation-service.matrix.svc.cluster.local.:8080"
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  data:
    - remoteRef:
        conversionStrategy: Default
        key: /matrix/matrix-rtc
        property: livekit-secret
      secretKey: livekitSecret
    - remoteRef:
        conversionStrategy: Default
        key: /matrix/matrix-rtc
        property: as-token
      secretKey: asToken
    - remoteRef:
        conversionStrategy: Default
        key: /matrix/matrix-rtc
        property: hs-token
      secretKey: hsToken
