---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-mas-secrets
spec:
  refreshInterval: "1h"
  target:
    name: matrix-mas-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  data:
    - remoteRef:
        conversionStrategy: Default
        key: /matrix/mas
        property: encryption-secret
      secretKey: encryption-secret
    - remoteRef:
        conversionStrategy: Default
        key: /matrix/mas
        property: synapse-shared-secret
      secretKey: synapse-shared-secret
    - remoteRef:
        conversionStrategy: Default
        key: /matrix/mas
        property: rsa-private-key
      secretKey: rsa-private-key
    - remoteRef:
        conversionStrategy: Default
        key: /matrix/mas
        property: ecdsa-prime256v1-private-key
      secretKey: ecdsa-prime256v1-private-key
