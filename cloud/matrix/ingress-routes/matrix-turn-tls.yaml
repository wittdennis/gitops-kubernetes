---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: matrix-turn-tls
  annotations:
    # IngressRouteTCP has no status address; reuse the traefik LB record of the Ingresses.
    external-dns.kubernetes.io/target: matrix.jackpoint.xyz
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`turn.jackpoint.xyz`)
      services:
        - name: matrix-matrix-rtc-sfu-turn-tls
          port: 30003
  # LiveKit terminates TURN/TLS itself with the chart's turn.jackpoint.xyz certificate.
  tls:
    passthrough: true
