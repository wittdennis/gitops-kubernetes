---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-postgres
spec:
  instances: 2
  logLevel: warning
  enablePDB: false
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: false
  # Same region as Synapse; fsn1 has exactly one worker per instance.
  affinity:
    nodeSelector:
      topology.kubernetes.io/region: fsn1
    podAntiAffinityType: required
  bootstrap:
    initdb:
      database: synapse
      owner: synapse
      # Synapse refuses to start on a database with a non-C collation.
      localeCollate: C
      localeCType: C
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgres
    major: 18
  managed:
    roles:
      - name: synapse
        superuser: false
        createdb: false
        login: true
      - name: mas
        superuser: false
        createdb: false
        login: true
        passwordSecret:
          name: matrix-mas-postgres
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backup-store
  resources:
    requests:
      cpu: 100m
      ephemeral-storage: 50Mi
      memory: 256Mi
  # CNPG replicates between instances, so each volume only needs a local copy.
  storage:
    size: 10Gi
    storageClass: longhorn-local
  walStorage:
    size: 5Gi
    storageClass: longhorn-local
