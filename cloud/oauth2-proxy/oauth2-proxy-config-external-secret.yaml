---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-platform
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy-secrets
    creationPolicy: Owner
  data:
    - remoteRef:
        conversionStrategy: Default
        key: /oauth2-proxy/azure-oidc
        property: client-id
      secretKey: client-id
    - remoteRef:
        conversionStrategy: Default
        key: /oauth2-proxy/azure-oidc
        property: client-secret
      secretKey: client-secret
    - remoteRef:
        conversionStrategy: Default
        key: /oauth2-proxy/cookie-config
        property: cookie-secret
      secretKey: cookie-secret
