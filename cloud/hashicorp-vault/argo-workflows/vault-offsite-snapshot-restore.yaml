# yaml-language-server: $schema=https://raw.githubusercontent.com/argoproj/argo-workflows/master/api/jsonschema/schema.json
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: vault-offsite-snapshot-restore
spec:
  entrypoint: vault-offsite-snapshot-restore
  securityContext:
    runAsGroup: 1000
    runAsUser: 100
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  activeDeadlineSeconds: 1200
  podGC:
    strategy: OnPodCompletion
  templates:
    - name: vault-offsite-snapshot-restore
      steps:
        - - name: list-snapshots
            template: list-snapshots
        - - name: choose-snapshot
            template: choose-snapshot
        - - name: download-snapshot
            template: download-snapshot
            arguments:
              parameters:
                - name: snapshot_id
                  value: "{{steps.choose-snapshot.outputs.parameters.snapshot_id}}"
        - - name: restore-snapshot
            template: restore-snapshot
            arguments:
              artifacts:
                - name: vault-snapshot
                  from: "{{steps.download-snapshot.outputs.artifacts.vault-snapshot}}"

    - name: list-snapshots
      automountServiceAccountToken: true
      serviceAccountName: vault
      container:
        image: restic/restic:0.19.1 # renovate
        command: [sh, -c]
        args:
          - |
            set -eu

            restic init || true
            restic snapshots
        volumeMounts:
          - name: tmp
            mountPath: /tmp
        env:
          - name: RESTIC_PASSWORD
            valueFrom:
              secretKeyRef:
                name: vault-backup-settings
                key: restic-password
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: vault-backup-settings
                key: access-key
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: vault-backup-settings
                key: secret-key
          - name: RESTIC_REPOSITORY
            value: s3:https://nbg1.your-objectstorage.com/pseud0random-backups/vault-homelab
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
      volumes:
        - name: tmp
          emptyDir: {}

    - name: choose-snapshot
      suspend: {}
      inputs:
        parameters:
          - name: snapshot_id
            default: "CHANGE ME!"
            description: >-
              Snapshot ID to be restored. Can be retrieved from previous step
      outputs:
        parameters:
          - name: snapshot_id
            valueFrom:
              supplied: {}

    - name: download-snapshot
      automountServiceAccountToken: true
      serviceAccountName: vault
      inputs:
        parameters:
          - name: snapshot_id
      outputs:
        artifacts:
          - name: vault-snapshot
            path: /tmp/backup.snap
            s3:
              key: "{{workflow.name}}/backup.snap"
      container:
        image: restic/restic:0.19.1 # renovate
        command: [sh, -c]
        args:
          - |
            set -eu

            echo "Getting snapshot from restic repository"
            restic init || true
            restic restore {{inputs.parameters.snapshot_id}} --target / --path /tmp/backup.snap
        volumeMounts:
          - name: tmp
            mountPath: /tmp
        env:
          - name: RESTIC_PASSWORD
            valueFrom:
              secretKeyRef:
                name: vault-backup-settings
                key: restic-password
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: vault-backup-settings
                key: access-key
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: vault-backup-settings
                key: secret-key
          - name: RESTIC_REPOSITORY
            value: s3:https://nbg1.your-objectstorage.com/pseud0random-backups/vault-cloud
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
      volumes:
        - name: tmp
          emptyDir: {}

    - name: restore-snapshot
      automountServiceAccountToken: true
      serviceAccountName: vault
      inputs:
        artifacts:
          - name: vault-snapshot
            path: /tmp/backup.snap
      container:
        image: hashicorp/vault:2.0.3 # renovate
        command: [sh, -c]
        args:
          - |
            echo "Authenticating against Vault"
            export JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
            export VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login role="vault-snapshot-role" jwt="${JWT}")

            echo "Restoring snapshot to Vault"
            vault operator raft snapshot restore -force /tmp/backup.snap
        volumeMounts:
          - name: tmp
            mountPath: /tmp
        env:
          - name: VAULT_ADDR
            value: https://vault-active.hashicorp-vault.svc.cluster.local:8200
          - name: VAULT_CACERT
            value: /vault/userconfig/vault-server-cert/ca.crt
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
      volumes:
        - name: tmp
          emptyDir: {}
