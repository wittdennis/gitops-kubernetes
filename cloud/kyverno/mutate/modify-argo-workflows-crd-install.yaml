---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: modify-argo-workflows-crd-install
  annotations:
    policies.kyverno.io/title: Modify Argo Workflows crd install job
    policies.kyverno.io/category: Security
    policies.kyverno.io/subject: Pod
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    # Job pods only carry generateName at admission time.
    - name: is-crd-install-pod
      expression: >-
        (has(object.metadata.name) && object.metadata.name.startsWith('argo-workflows-crd-install-')) ||
        (has(object.metadata.generateName) && object.metadata.generateName.startsWith('argo-workflows-crd-install-'))
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              automountServiceAccountToken: false,
              securityContext: Object.spec.securityContext{
                runAsNonRoot: true,
                runAsUser: 1000,
                runAsGroup: 1000,
                fsGroup: 1000,
                seccompProfile: Object.spec.securityContext.seccompProfile{
                  type: "RuntimeDefault"
                }
              },
              containers: [
                Object.spec.containers{
                  name: "apply",
                  securityContext: Object.spec.containers.securityContext{
                    allowPrivilegeEscalation: false,
                    runAsNonRoot: true,
                    runAsUser: 1000,
                    runAsGroup: 1000,
                    capabilities: Object.spec.containers.securityContext.capabilities{
                      drop: ["ALL"]
                    }
                  }
                }
              ]
            }
          }
