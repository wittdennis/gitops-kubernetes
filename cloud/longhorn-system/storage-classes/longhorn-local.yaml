---
# For workloads that replicate themselves (e.g. CNPG): one replica on the consuming node.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-local
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
# strict-local needs the volume created on the node the pod is scheduled to.
volumeBindingMode: WaitForFirstConsumer
parameters:
  numberOfReplicas: "1"
  dataLocality: strict-local
  dataEngine: v1
  fsType: ext4
  staleReplicaTimeout: "30"
