---
# glint.yaml — generated by `glint init`
# Detected: plain Kubernetes manifests
version: "v1alpha1"

discovery:
  paths: ["."]
  exclude:
    - "vendor/**"
    - "**/.git/**"
    - "**/.terraform/**"
    # chart lives in a private ghcr package, CI has no pull credentials for it
    - "homelab/applications/headscale-operator.cd.yaml"

render:
  helm:
    kubernetes_version: "1.37.2" # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet extractVersion=^v(?<version>.+)$ versioning=semver
    include_crds: true
  subprocess_fallback: false

rules:
  catalogs:
    cis:
      enabled: true

  built_in:
    no_latest_tag:
      enabled: true
      severity: error
    resource_requests:
      enabled: false
      severity: warning
    deprecated_apis:
      enabled: true
      severity: error

  # Node-level agents (CNI, CSI, node metrics/logs) require host access by design.
  exceptions:
    - rule: cis-5.2.2-privileged-containers
      resources:
        - {kind: DaemonSet, namespace: kube-system, name: cilium, reason: CNI}
        - {kind: DaemonSet, namespace: kube-system, name: hcloud-csi-node, reason: CSI node plugin}
        - {kind: DaemonSet, namespace: longhorn-system, name: longhorn-manager, reason: storage engine}
        - {kind: DaemonSet, namespace: proxmox-csi, name: proxmox-csi-plugin-node, reason: CSI node plugin}
    - rule: cis-5.2.3-host-pid
      resources:
        - {kind: DaemonSet, namespace: victoria-metrics-stack, name: vm-stack-prometheus-node-exporter, reason: node metrics}
    - rule: cis-5.2.5-host-network
      resources:
        - {kind: DaemonSet, namespace: kube-system, name: "cilium*", reason: CNI}
        - {kind: Deployment, namespace: kube-system, name: cilium-operator, reason: CNI}
        - {kind: DaemonSet, namespace: kube-system, name: hcloud-csi-node, reason: CSI node plugin}
        - {kind: Deployment, namespace: kube-system, name: hcloud-cloud-controller-manager, reason: cloud controller}
        - {kind: DaemonSet, namespace: "mogenius-operator*", name: "mogenius-operator*-node-metrics", reason: node metrics}
        - {kind: DaemonSet, namespace: victoria-metrics-stack, name: vm-stack-prometheus-node-exporter, reason: node metrics}
    - rule: cis-5.2.12-hostpath-volumes
      resources:
        - {kind: DaemonSet, namespace: grafana-alloy, name: alloy, reason: node log collection}
        - {kind: DaemonSet, namespace: kube-system, name: "cilium*", reason: CNI}
        - {kind: DaemonSet, namespace: kube-system, name: hcloud-csi-node, reason: CSI node plugin}
        - {kind: DaemonSet, namespace: kube-system, name: node-feature-discovery-worker, reason: node feature detection}
        - {kind: DaemonSet, namespace: longhorn-system, name: longhorn-manager, reason: storage engine}
        - {kind: DaemonSet, namespace: "mogenius-operator*", name: "mogenius-operator*-node-metrics", reason: node metrics}
        - {kind: DaemonSet, namespace: proxmox-csi, name: proxmox-csi-plugin-node, reason: CSI node plugin}
        - {kind: DaemonSet, namespace: victoria-metrics-stack, name: vm-stack-prometheus-node-exporter, reason: node metrics}

  # Custom CEL rules — add your own policies here:
  custom: []

  # Load rules from additional files:
  # rule_files:
  #   - "glint-rules/*.yaml"

output:
  format: text
  color: auto
  summary: true

fail_on:
  - error
